<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title><effect-name> — concept</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0b; color: #f4f4f2;
    font-family: ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
  #app { position: fixed; inset: 0; }

  /* Live slider panel — one control per tunable param. Tune ranges so the
     full expressive range of the effect is reachable. */
  .controls {
    position: fixed; right: 16px; top: 16px; z-index: 10; font-size: 12px; color: #cfcfd2;
    background: rgba(20,20,22,.6); padding: 12px 14px; border-radius: 10px;
    backdrop-filter: blur(8px); display: grid; gap: 8px; min-width: 230px;
  }
  .controls strong { color: #fff; }
  .controls label { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
  .controls input[type=range] { width: 130px; }
  .controls .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .controls select { background:#1b1b1e; color:#eee; border:1px solid #333; border-radius:6px; padding:3px 6px; }
</style>
</head>
<body>
  <div id="app"></div>

  <aside class="controls">
    <div class="row"><strong><effect-name></strong></div>
    <!-- one slider/select per param, with id="c_<param>" -->
    <label>param a <input id="c_paramA" type="range" min="0" max="1" step="0.01" value="0.5"></label>
    <!-- <label class="row">mode
