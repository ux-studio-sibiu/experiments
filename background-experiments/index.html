<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Background Experiments - SVG Patterns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!-- the randomize-studio's panel, copied in (see style.css) -->
<link rel="stylesheet" href="vendor/randomize-studio/css/panel.css">
<link rel="stylesheet" href="vendor/randomize-studio/css/controls.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="panelShow" data-mark="plus">Maximize edit panel</button>
  <section class="stage">
  </section>

  <aside class="panel" id="panel">
    <div class="phead">
      <b>Backgrounds</b>
      <span class="spacer"></span>
      <button id="randomize" class="primary" title="Randomize (R)">Randomize</button>
      <button id="panelToggle" class="iconbtn" data-mark="minus" title="Minimize"></button>
    </div>

    <div class="pbody">
      <!-- hidden from the panel; still in the page because script.js reads and sets these fields -->
      <div class="grp" hidden>
        <h3>Target element</h3>
        <div class="row"><label>selector</label><input id="targetSelector" type="text" placeholder="#elem.class"></div>
        <div class="row"><label>bg colour</label><input id="targetBgColor" type="color"><span></span></div>
        <div class="row"><label>bg α</label><input id="targetBgAlpha" type="range" min="0" max="1" step="0.05"><output id="targetBgAlphaV"></output></div>
        <p class="hint">CSS selector for the element that receives the patterns, through ::before / ::after.</p>
      </div>

      <div class="grp">
        <h3>Background image
          <button id="copyCSS" class="iconbtn" data-mark="copy" title="Copy pattern CSS" aria-label="Copy pattern CSS"></button></h3>
        <div class="btnrow">
          <button id="bgRandomPhoto" data-mark="randomize">Random photo</button>
          <button id="bgUpload" data-mark="upload">Upload</button>
        </div>
        <input id="bgImageUpload" type="file" accept="image/*" hidden>
      </div>

      <div class="grp" id="grp-pattern">
        <h3>Pattern
          <button class="iconbtn" data-rand="pattern" title="Randomize pattern"></button>
          <button class="lockbtn" data-lock="pattern" aria-pressed="false" title="Lock during randomize"></button></h3>
        <!-- previews rather than a <select>, as in the randomize-studio: an <option> cannot draw a tile -->
        <div class="pat-grid" id="patternGrid" aria-label="Pattern"></div>
        <div class="pat-current" id="patternName"></div>
        <div class="row"><label>scale</label><input id="patternScale" type="range" min="0.1" max="10" step="0.2"><output id="patternScaleV"></output></div>
        <div class="row"><label>opacity</label><input id="patternOpacity" type="range" min="0" max="1" step="0.05"><output id="patternOpacityV"></output></div>
        <div class="row"><label>colour</label><input id="patternColor" type="color"><span></span></div>
        <div class="row"><label>blend</label><select id="patternBlend">
          <option value="normal">normal</option>
          <option value="multiply">multiply</option>
          <option value="screen">screen</option>
          <option value="overlay">overlay</option>
          <option value="color-dodge">color-dodge</option>
          <option value="color-burn">color-burn</option>
          <option value="lighten">lighten</option>
          <option value="darken">darken</option>
        </select></div>
        <div class="row"><label>rotation</label><input id="patternRotate" type="range" min="0" max="360" step="15"><output id="patternRotateV"></output></div>
      </div>

      <div class="grp" id="grp-pattern2">
        <h3>Pattern 2
          <button class="iconbtn" data-rand="pattern2" title="Randomize pattern 2"></button>
          <button class="lockbtn" data-lock="pattern2" aria-pressed="false" title="Lock during randomize"></button></h3>
        <div class="row"><label>show</label><span></span><input id="pattern2Enabled" type="checkbox"></div>
        <div id="pattern2-config" style="display:none">
          <div class="pat-grid" id="pattern2Grid" aria-label="Pattern 2"></div>
          <div class="pat-current" id="pattern2Name"></div>
          <div class="row"><label>scale</label><input id="pattern2Scale" type="range" min="0.1" max="10" step="0.2"><output id="pattern2ScaleV"></output></div>
          <div class="row"><label>opacity</label><input id="pattern2Opacity" type="range" min="0" max="1" step="0.05"><output id="pattern2OpacityV"></output></div>
          <div class="row"><label>colour</label><input id="pattern2Color" type="color"><span></span></div>
          <div class="row"><label>blend</label><select id="pattern2Blend">
            <option value="normal">normal</option>
            <option value="multiply">multiply</option>
            <option value="screen">screen</option>
            <option value="overlay">overlay</option>
            <option value="color-dodge">color-dodge</option>
            <option value="color-burn">color-burn</option>
            <option value="lighten">lighten</option>
            <option value="darken">darken</option>
          </select></div>
          <div class="row"><label>rotation</label><input id="pattern2Rotate" type="range" min="0" max="360" step="15"><output id="pattern2RotateV"></output></div>
        </div>
      </div>
    </div>
  </aside>

<script src="patterns.js"></script>
<script src="script.js"></script>
<script src="panel-window.js"></script>
</body>
</html>
