<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Paint — concept</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root { font-family: 'Geist Mono', Consolas, monospace; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      background: #008080;
    }

    /* Win95 bevels: outset = light TL + dark BR; inset = reverse. */
    .bevel-out {
      border: 2px solid #dfdfdf;
      border-bottom-color: #404040;
      border-right-color: #404040;
    }
    .bevel-in {
      border: 2px solid #808080;
      border-bottom-color: #dfdfdf;
      border-right-color: #dfdfdf;
    }

    .window {
      background: #c0c0c0;
      display: flex;
      flex-direction: column;
      width: min(880px, 95vw);
      height: min(620px, 92vh);
    }

    .titlebar {
      background: #000080;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 2px 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .titlebar svg { display: block; }

    .body { display: flex; flex: 1; min-height: 0; }

    /* Tools, and under them the width picker - the same column in the real
       thing, which is why the two share an edge rather than floating apart. */
    .sidebar { display: flex; flex-direction: column; flex-shrink: 0; }

    .toolbox {
      background: #c0c0c0;
      padding: 1px;
      margin: 2px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-content: start;
      flex-shrink: 0;
    }
    .tool {
      width: 25px; height: 23px;
      display: grid; place-items: center;
      background: #c0c0c0;
      border: 1px solid #c0c0c0;
      cursor: pointer;
      padding: 2px;
    }
    .tool.active {
      border: 1px solid #404040;
      border-bottom-color: #dfdfdf;
      border-right-color: #dfdfdf;
    }
    .tool svg { display: block; image-rendering: pixelated; }

    /* The width picker. One row per width, each drawn as a bar of that exact
       thickness - the control shows you the thing it sets rather than a number,
       which is how the original did it and is the only reason a 1px and a 3px
       option are tellable apart at a glance. */
    .sizebox {
      background: #c0c0c0;
      margin: 0 2px 2px;
      padding: 2px 1px;
      display: grid;
      gap: 1px;
      align-content: start;
    }
    .size {
      height: 14px;
      display: grid;
      place-items: center;
      background: #c0c0c0;
      border: 1px solid #c0c0c0;
      cursor: pointer;
      padding: 0;
    }
    .size.active {
      border: 1px solid #404040;
      border-bottom-color: #dfdfdf;
      border-right-color: #dfdfdf;
    }
    .size i { display: block; width: 34px; background: #000; }

    .canvas-wrap {
      flex: 1;
      margin: 2px 2px 2px 0;
      background: #fff;
      min-height: 0;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    .palette-row {
      padding: 3px 4px 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      border-top: 1px solid #808080;
    }
    .swatch-pair { position: relative; width: 24px; height: 22px; flex-shrink: 0; }
    .swatch-pair .bg, .swatch-pair .fg {
      position: absolute;
      width: 14px; height: 14px;
      border: 1px solid #808080;
      border-top-color: #404040;
      border-left-color: #404040;
      border-bottom-color: #dfdfdf;
      border-right-color: #dfdfdf;
    }
    .swatch-pair .bg { right: 0; bottom: 0; background: #fff; }
    .swatch-pair .fg { left: 0; top: 0; }

    .palette {
      display: grid;
      grid-template-columns: repeat(14, 11px);
      grid-template-rows: repeat(2, 11px);
    }
    .color {
      width: 11px; height: 11px;
      padding: 0;
      cursor: pointer;
      border: 1px solid #808080;
      border-top-color: #404040;
      border-left-color: #404040;
      border-bottom-color: #dfdfdf;
      border-right-color: #dfdfdf;
    }
    .color.active { outline: 2px solid #000; z-index: 1; }

    .actions { margin-left: auto; display: flex; gap: 4px; padding-right: 2px; }
    .btn {
      font: 11px 'Geist Mono', Consolas, monospace;
      background: #c0c0c0;
      padding: 2px 10px;
      cursor: pointer;
    }
    .btn:active { border: 2px solid #808080; border-bottom-color: #dfdfdf; border-right-color: #dfdfdf; }

    .statusbar {
      border-top: 1px solid #808080;
      padding: 2px 6px;
      font-size: 11px;
      color: #000;
      display: flex; gap: 12px;
      flex-shrink: 0;
    }
    .statusbar .cell { min-width: 90px; }
  </style>
</head>
<body>
  <div class="window bevel-out" role="application" aria-label="Paint">
    <div class="titlebar">
      <svg width="8" height="11" viewBox="0 0 8 11"><polygon points="5,0 0,6 3.5,6 2.5,11 8,4.5 4.5,4.5 6,0" fill="#ff0" stroke="#ff8c00" stroke-width="0.3"/></svg>
      <span>untitled &mdash; Paint</span>
    </div>

    <div class="body">
      <div class="sidebar">
        <div class="toolbox bevel-in" id="toolbox"></div>
        <div class="sizebox bevel-in" id="sizebox"></div>
      </div>

      <div class="canvas-wrap bevel-in" id="canvasWrap">
        <canvas id="canvas"></canvas>
      </div>
    </div>

    <div class="palette-row">
      <div class="swatch-pair">
        <div class="bg"></div>
        <div class="fg" id="fgSwatch" style="background:#000"></div>
      </div>
      <div class="palette" id="palette"></div>
      <div class="actions">
        <button class="btn bevel-out" id="clearBtn" type="button">Clear</button>
      </div>
    </div>

    <div class="statusbar">
      <span class="cell" id="statusTool">Tool: pencil</span>
      <span class="cell" id="statusCoords">&nbsp;</span>
    </div>
  </div>

<script>
(() => {
  // ------- Chunky pixel icons (inline SVG, rect-per-pixel) -------
  const px = (cells, defaultFill = '#000') => {
    let rects = '';
    for (const [x, y, fill] of cells) {
      rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${fill || defaultFill}"/>`;
    }
    return `<svg viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">${rects}</svg>`;
  };

  // Diagonal pencil pointing top-right
  const ICON_PENCIL = px([
    [12,2],[11,3],[12,3],[10,4],[11,4],[9,5],[10,5],[8,6],[9,6],
    [7,7],[8,7],[6,8],[7,8],[5,9],[6,9],[4,10],[5,10],
    [3,11],[4,11],[3,12],[2,13],[3,13]
  ]);
  // Brush bristles
  const ICON_BRUSH = px([
    [9,2,'#000'],[10,2,'#000'],
    [8,3,'#000'],[9,3,'#ffcc00'],[10,3,'#ffcc00'],[11,3,'#000'],
    [8,4,'#000'],[9,4,'#ffcc00'],[10,4,'#ffcc00'],[11,4,'#000'],
    [8,5,'#000'],[9,5,'#808080'],[10,5,'#808080'],[11,5,'#000'],
    [7,6],[8,6],[9,6],[10,6],[11,6],[12,6],
    [8,7],[11,7],
    [9,8],[10,8],
    [9,9],[10,9]
  ]);
  // Eraser block
  const ICON_ERASER = (() => {
    const cells = [];
    for (let x = 4; x < 12; x++) {
      for (let y = 6; y < 11; y++) {
        let f = '#fff';
        if (y === 10) f = '#404040';
        else if (x === 11) f = '#808080';
        else if (y === 6 || x === 4) f = '#fff';
        else f = '#ffcccc';
        cells.push([x, y, f]);
      }
    }
    // outline
    for (let x = 4; x <= 11; x++) { cells.push([x, 5, '#000']); cells.push([x, 11, '#000']); }
    for (let y = 5; y <= 11; y++) { cells.push([3, y, '#000']); cells.push([12, y, '#000']); }
    return px(cells);
  })();
  // Diagonal line
  const ICON_LINE = px([
    [13,2],[12,3],[13,3],[11,4],[12,4],[10,5],[11,5],[9,6],[10,6],
    [8,7],[9,7],[7,8],[8,8],[6,9],[7,9],[5,10],[6,10],
    [4,11],[5,11],[3,12],[4,12],[2,13],[3,13]
  ]);
  // Rectangle outline
  const ICON_RECT = (() => {
    const cells = [];
    for (let i = 3; i <= 12; i++) { cells.push([i, 4]); cells.push([i, 11]); }
    for (let i = 4; i <= 10; i++) { cells.push([3, i]); cells.push([12, i]); }
    return px(cells);
  })();
  // Ellipse outline (handcrafted)
  const ICON_ELLIPSE = px([
    [5,3],[6,3],[7,3],[8,3],[9,3],[10,3],
    [4,4],[11,4],
    [3,5],[12,5],
    [2,6],[13,6],
    [2,7],[13,7],
    [2,8],[13,8],
    [3,9],[12,9],
    [4,10],[11,10],
    [5,11],[6,11],[7,11],[8,11],[9,11],[10,11]
  ]);

  const TOOLS = [
    { id: 'pencil',  label: 'Pencil',    icon: ICON_PENCIL  },
    { id: 'brush',   label: 'Brush',     icon: ICON_BRUSH   },
    { id: 'eraser',  label: 'Eraser',    icon: ICON_ERASER  },
    { id: 'line',    label: 'Line',      icon: ICON_LINE    },
    { id: 'rect',    label: 'Rectangle', icon: ICON_RECT    },
    { id: 'ellipse', label: 'Ellipse',   icon: ICON_ELLIPSE },
  ];

  // Stroke width per tool. Not a constant any more: the width picker writes
  // into it, and each tool remembers what it was last set to - so a fat brush
  // does not turn the pencil into a marker when you switch back.
  //
  // Every default is a value in WIDTHS below, or the picker would open with
  // nothing selected and the first click would look like it changed two things.
  const SIZES = { pencil: 3, brush: 6, eraser: 12, line: 3, rect: 3, ellipse: 3 };

  // The three widths the picker offers, each with the bar it draws itself as.
  //
  // The bar is one step thinner than the stroke it sets. The row is 14px tall,
  // and at its true size a 12px bar is a black slab with no air around it - the
  // three options stop being tellable apart at a glance, which is the only job
  // the bar has. Drawn at 1 / 3 / 6 the steps stay legible while the strokes
  // they produce are still 3 / 6 / 12.
  const WIDTHS = [
    { w: 3,  bar: 1 },
    { w: 6,  bar: 3 },
    { w: 12, bar: 6 },
  ];

  // 14x2 swatch grid (MS Paint palette).
  const PALETTE = [
    '#000000','#808080','#800000','#808000','#008000','#008080','#000080','#800080','#808040','#004040','#0000ff','#004080','#400080','#800040',
    '#ffffff','#c0c0c0','#ff0000','#ffff00','#00ff00','#00ffff','#ff00ff','#ffff80','#00ff80','#80ffff','#0080ff','#8000ff','#ff0080','#804000',
  ];

  // ------- State -------
  let tool = 'pencil';
  let color = '#000000';
  let drawing = false;
  let start = { x: 0, y: 0 };
  let prev  = { x: 0, y: 0 };
  let snapshot = null; // ImageData used to rubber-band shapes

  // ------- DOM wiring -------
  const canvas    = document.getElementById('canvas');
  const wrap      = document.getElementById('canvasWrap');
  const toolbox   = document.getElementById('toolbox');
  const sizebox   = document.getElementById('sizebox');
  const palette   = document.getElementById('palette');
  const fgSwatch  = document.getElementById('fgSwatch');
  const statusTool = document.getElementById('statusTool');
  const statusCoords = document.getElementById('statusCoords');
  const ctx = canvas.getContext('2d');

  for (const t of TOOLS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tool' + (t.id === tool ? ' active' : '');
    b.title = t.label;
    b.dataset.id = t.id;
    b.innerHTML = t.icon;
    b.addEventListener('click', () => {
      tool = t.id;
      for (const el of toolbox.children) el.classList.toggle('active', el.dataset.id === tool);
      syncSize();
    });
    toolbox.appendChild(b);
  }

  // The picker shows the CURRENT tool's width, so switching tools moves the
  // marker as well as changing what the canvas does. Status bar says the number
  // because the bars stop being tellable apart somewhere past 12.
  function syncSize() {
    statusTool.textContent = `Tool: ${tool} (${SIZES[tool]}px)`;
    for (const el of sizebox.children) {
      el.classList.toggle('active', Number(el.dataset.w) === SIZES[tool]);
    }
  }

  for (const { w, bar } of WIDTHS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'size';
    b.title = `${w}px`;          // the stroke, not the bar - that is what it does
    b.dataset.w = w;
    b.innerHTML = `<i style="height:${bar}px"></i>`;
    b.addEventListener('click', () => { SIZES[tool] = w; syncSize(); });
    sizebox.appendChild(b);
  }
  syncSize();

  for (const c of PALETTE) {
    const sw = document.createElement('button');
    sw.type = 'button';
    sw.className = 'color' + (c === color ? ' active' : '');
    sw.style.background = c;
    sw.dataset.color = c;
    sw.addEventListener('click', () => {
      color = c;
      fgSwatch.style.background = c;
      for (const el of palette.children) el.classList.toggle('active', el.dataset.color === c);
    });
    palette.appendChild(sw);
  }

  // ------- Sizing: match container, preserve content across resizes -------
  let sized = false;
  const resize = () => {
    const r = wrap.getBoundingClientRect();
    const w = Math.max(1, Math.floor(r.width));
    const h = Math.max(1, Math.floor(r.height));
    const prevImg = sized ? ctx.getImageData(0, 0, canvas.width, canvas.height) : null;
    canvas.width = w;
    canvas.height = h;
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, w, h);
    if (prevImg) ctx.putImageData(prevImg, 0, 0);
    const wasBlank = !sized;
    sized = true;
    if (wasBlank) playIntro();
  };
  new ResizeObserver(resize).observe(wrap);

  // ------- Drawing -------
  const ptOf = (e) => {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };

  canvas.addEventListener('pointerdown', (e) => {
    cancelIntro();
    drawing = true;
    const p = ptOf(e);
    start = p; prev = p;
    canvas.setPointerCapture(e.pointerId);

    if (tool === 'line' || tool === 'rect' || tool === 'ellipse') {
      // Snapshot so we can restore-then-redraw each move (rubber-banding).
      snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
      return;
    }

    // Freehand tools: stamp an initial dot so a single click leaves a mark.
    ctx.fillStyle = tool === 'eraser' ? '#fff' : color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, SIZES[tool] / 2, 0, Math.PI * 2);
    ctx.fill();
  });

  canvas.addEventListener('pointermove', (e) => {
    const p = ptOf(e);
    statusCoords.textContent = `${Math.round(p.x)}, ${Math.round(p.y)}`;
    if (!drawing) return;

    if (tool === 'pencil' || tool === 'brush' || tool === 'eraser') {
      ctx.strokeStyle = tool === 'eraser' ? '#fff' : color;
      ctx.lineWidth = SIZES[tool];
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(prev.x, prev.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      prev = p;
      return;
    }

    // Shape preview: undo the previous preview, then draw fresh.
    if (snapshot) ctx.putImageData(snapshot, 0, 0);
    ctx.strokeStyle = color;
    ctx.lineWidth = SIZES[tool];
    ctx.lineCap = 'round';

    if (tool === 'line') {
      ctx.beginPath();
      ctx.moveTo(start.x, start.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    } else if (tool === 'rect') {
      ctx.strokeRect(start.x, start.y, p.x - start.x, p.y - start.y);
    } else if (tool === 'ellipse') {
      const cx = (start.x + p.x) / 2;
      const cy = (start.y + p.y) / 2;
      const rx = Math.abs(p.x - start.x) / 2;
      const ry = Math.abs(p.y - start.y) / 2;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  });

  const endStroke = () => { drawing = false; snapshot = null; };
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointerleave', endStroke);
  canvas.addEventListener('pointercancel', endStroke);

  document.getElementById('clearBtn').addEventListener('click', () => {
    cancelIntro();
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  });

  // ------- Auto-draw intro: jittery hand-drawn scribble that bails on first click -------

  // ---- picking an ink dark enough to read on white paper ----
  // HSL lightness is not perceptual, and the gap is not small: at 38% lightness
  // a saturated blue reads 11.9:1 against white and a saturated yellow reads
  // 2.0:1 - the second is barely a mark on the page. So no single lightness cap
  // works for every hue; a cap kind to yellow turns every other hue to mud.
  //
  // Instead each hue is walked down from 45% until it actually clears the bar.
  // Yellow comes out near 20%, blue stays at 45%, and both are legible. The
  // measurement is the WCAG relative-luminance formula, which is the same one a
  // contrast checker uses.
  const INK_CONTRAST = 6;   // against #fff, comfortably past the 4.5 AA line
  const srgb = (v) => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
  const luminance = (h, s, l) => {
    s /= 100; l /= 100;
    const a = s * Math.min(l, 1 - l);
    const ch = (n) => { const k = (n + h / 30) % 12; return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
    return 0.2126 * srgb(ch(0)) + 0.7152 * srgb(ch(8)) + 0.0722 * srgb(ch(4));
  };
  const darkestNeeded = (h, s) => {
    for (let l = 45; l > 10; l--) if (1.05 / (luminance(h, s, l) + 0.05) >= INK_CONTRAST) return l;
    return 10;
  };

  let introState = null;

  function cancelIntro() {
    if (!introState) return;
    clearTimeout(introState.t1);
    clearTimeout(introState.t2);
    introState.cancelled = true;
    introState = null;
  }

  function playIntro() {
    cancelIntro();
    // Normalized polylines in [0..1]^2 spelling PAINT, one entry per pen stroke.
    //
    // Capitals, and deliberately. The lowercase version this replaced was built
    // from bowls - four or five points curving back on themselves - and at a
    // weight you can actually see, the A closed into an O and the I and the T
    // ran together. Capitals are straight lines meeting at corners, which is
    // the one thing that survives both a heavy stroke and the jitter below.
    //
    // Cap height .28 to .50, so every letter sits between the same two lines.
    // The long strokes carry a midpoint they do not strictly need: jitter is
    // applied per point, so a two-point line comes out ruler-straight and only
    // its ends wobble. The midpoint is what bends it like a hand would.
    // `g` is which letter the stroke belongs to. Colour is picked per letter at
    // draw time rather than written in here - see letterInk below.
    const strokes = [
      { g: 0, pts: [[.08,.28],[.08,.39],[.08,.50]] },                            // P
      { g: 0, pts: [[.08,.28],[.16,.28],[.17,.31],[.17,.36],[.16,.39],[.08,.39]] },
      { g: 1, pts: [[.205,.50],[.2275,.39],[.25,.28]] },                         // A
      { g: 1, pts: [[.25,.28],[.2725,.39],[.295,.50]] },
      { g: 1, pts: [[.222,.43],[.278,.43]] },
      { g: 2, pts: [[.345,.28],[.405,.28]] },                                    // I
      { g: 2, pts: [[.375,.28],[.375,.39],[.375,.50]] },
      { g: 2, pts: [[.345,.50],[.405,.50]] },
      { g: 3, pts: [[.455,.50],[.455,.39],[.455,.28]] },                         // N
      { g: 3, pts: [[.455,.28],[.50,.39],[.545,.50]] },
      { g: 3, pts: [[.545,.50],[.545,.39],[.545,.28]] },
      { g: 4, pts: [[.58,.28],[.67,.28]] },                                      // T
      { g: 4, pts: [[.625,.28],[.625,.39],[.625,.50]] },
    ];
    const w = canvas.width, h = canvas.height;

    // Fit the word to the canvas rather than to the numbers above. The strokes
    // are drawn in whatever space was convenient; this measures the box they
    // actually occupy and maps it onto the canvas, filling most of it and
    // centred on both axes.
    //
    // One scale for both axes, not two, or the letters would stretch to the
    // window's shape - a wide window would flatten them and a tall one would
    // draw PAINT on stilts. Whichever axis runs out first decides, and the
    // slack on the other axis becomes the margin.
    const xs = strokes.flatMap(s => s.pts.map(p => p[0]));
    const ys = strokes.flatMap(s => s.pts.map(p => p[1]));
    const bx = Math.min(...xs), bw = Math.max(...xs) - bx;
    const by = Math.min(...ys), bh = Math.max(...ys) - by;
    // 0.84 minus 15%. It left no air for the scene - the sun and the gulls had
    // to crowd the corners above a word that was already touching them.
    const FILL = 0.714;                      // of the shorter-constrained axis
    const scale = Math.min(w * FILL / bw, h * FILL / bh);
    const offX = (w - bw * scale) / 2 - bx * scale;
    // Nudged below centre. The sky is doing more work than the ground - sun in
    // one corner, three gulls across the other - so the optical centre of the
    // finished picture sits above its geometric one, and the word has to come
    // down to meet it. Capped against the canvas so a short window cannot push
    // the letters into the grass.
    const DROP = Math.min(40, h * 0.08);
    const offY = (h - bh * scale) / 2 - by * scale + DROP;
    // A fresh set of colours every time it plays, one per LETTER rather than
    // one per stroke - the P's stem and its bowl in different colours would
    // read as two marks rather than as a letter.
    //
    // Hue and saturation are free; lightness is handed to darkestNeeded, which
    // measures it against white rather than guessing (see the note up by it).
    // The small extra subtraction only ever makes a letter darker, so it varies
    // the weight of the run without putting anything back at risk.
    //
    // Hues are spread evenly round the wheel from a random starting angle
    // rather than drawn independently: five free throws will sometimes hand you
    // two neighbouring reds, and the one thing these colours have to do is tell
    // the letters apart. The jitter stops it looking like a colour wheel.
    const glyphs = Math.max(...strokes.map(s => s.g)) + 1;
    const h0 = Math.random() * 360;
    const letterInk = Array.from({ length: glyphs }, (_, i) => {
      const hue = Math.round((h0 + (i * 360 / glyphs) + (Math.random() - 0.5) * 28) % 360);
      const sat = Math.round(68 + Math.random() * 27);                    // 68-95%
      const lit = Math.max(10, darkestNeeded(hue, sat) - Math.round(Math.random() * 8));
      return `hsl(${hue}, ${sat}%, ${lit}%)`;
    });

    const flat = strokes.map(s => ({
      g: s.g,
      color: letterInk[s.g],
      pts: s.pts.map(([x, y]) => [x * scale + offX, y * scale + offY]),
    }));
    const capPx = bh * scale;                // cap height on screen, in pixels

    // ---- the second pass ----
    // The whole word is written once, and only then gone back over - not each
    // stroke doubled as it is drawn. That is the order a person works in: you
    // write the thing, look at it, and then go over it in the brighter pen.
    // Doubling stroke by stroke reads as a tremor instead.
    //
    // Two things stop the second pass landing on top of the first. The offset
    // below is picked once per stroke and applied to all its points, so the
    // second pull is a line that misses in one direction rather than a cloud of
    // noise; and the jitter inside step() is rolled fresh per point, so the two
    // passes wander differently along their length. Together they give the
    // doubled edge and the small bulges where the two cross.
    //
    // Opacity is deliberately left alone. Building the colour up by drawing a
    // translucent stroke twice would muddy both passes, and the two-colour
    // registration below is the whole effect - it only works if the top pass
    // is opaque enough to hide the one underneath except where it misses.
    //
    // The second pass is a DIFFERENT colour: a bright marker over the dark
    // measured ink. That is where the look comes from - the dark hue surviving
    // as a sliver down one edge, the way a misregistered print shows the plate
    // under it. The two hues are unrelated on purpose; a dark version of the
    // same colour would just read as a shadow.
    const MARKERS = ['#2e1fc9', '#c8125e', '#ffe800', '#9b1fd6', '#f4197c'];
    const markerInk = MARKERS.slice();
    for (let i = markerInk.length - 1; i > 0; i--) {   // Fisher-Yates, so the
      const j = Math.floor(Math.random() * (i + 1));   // letters do not always
      [markerInk[i], markerInk[j]] = [markerInk[j], markerInk[i]];   // wear the
    }                                                  // same five in order
    const OFF = Math.max(1, capPx * 0.014);  // how far a second pull may miss by
    const overs = flat.map(s => {
      const dx = (Math.random() - 0.5) * 2 * OFF;
      const dy = (Math.random() - 0.5) * 2 * OFF;
      return {
        color: markerInk[s.g % markerInk.length],
        over: true,
        pts: s.pts.map(([x, y]) => [x + dx, y + dy]),
      };
    });
    // ---- the scene, drawn once the word is done ----
    // Pixel coordinates, not the letter box's. The word is fitted to a box in
    // the middle of the canvas; these have to find the real corners - sky above
    // the lettering, ground below it - so they are placed against w and h.
    //
    // R is the short side. Anything that has to stay round uses it for both
    // axes, or the sun comes out an ellipse on a wide window.
    const R = Math.min(w, h);
    const scene = [];
    // jit scales the hand-wobble down for small things - see the note by the
    // cloud's. Left out, a stroke gets the letters' full amount.
    const add = (color, pts, px, delay, jit) => scene.push({ color, pts, w: px, d: delay, jit });

    // The sun, top left: a ring gone round twice, then rays. Twice round for
    // the same reason the letters get a second pass - one clean circle looks
    // printed, and nothing else here is.
    const sx = 0.12 * w, sy = 0.15 * h, sr = 0.085 * R;
    const ring = (rad) => Array.from({ length: 15 }, (_, i) => {
      const a = (i / 14) * Math.PI * 2;
      return [sx + Math.cos(a) * rad, sy + Math.sin(a) * rad];
    });
    add('#ffd400', ring(sr), Math.max(4, R * 0.019), 15);
    add('#ffd400', ring(sr * 0.93), Math.max(4, R * 0.019), 15);

    // The rays get the word's treatment: all nine laid down in red, then all
    // nine gone over in yellow, each missing by a little. Same reason it works
    // on the letters - the red surviving down one side of each ray is what
    // makes it look drawn rather than plotted.
    const rays = Array.from({ length: 9 }, (_, i) => {
      const a = (i / 9) * Math.PI * 2 + 0.3;
      return [
        [sx + Math.cos(a) * sr * 1.35, sy + Math.sin(a) * sr * 1.35],
        [sx + Math.cos(a) * sr * 1.95, sy + Math.sin(a) * sr * 1.95],
      ];
    });
    const RAY_OFF = Math.max(1, R * 0.007);
    for (const r of rays) add('#ff2d00', r, Math.max(3, R * 0.013), 11);
    for (const r of rays) {
      const dx = (Math.random() - 0.5) * 2 * RAY_OFF;
      const dy = (Math.random() - 0.5) * 2 * RAY_OFF;
      add('#ffe800', r.map(([x, y]) => [x + dx, y + dy]), Math.max(2, R * 0.010), 9);
    }

    // ---- the cloud ----
    // Before the gulls, which is the whole trick: everything here is painted in
    // order onto one canvas, so "behind" is just "earlier". The birds go on top
    // of it a few strokes later and read as being in front.
    //
    // Four shades rather than one flat colour. A cloud is the one thing in this
    // picture that is not a line - it is a volume - and the only way a drawing
    // of lines says volume is by putting a darker tone where the light is not.
    // So: a slate outline, a paler one over it missing by a little the way
    // everything else here does, then hatching in two tones, denser and greyer
    // along the underside.
    const CLOUD = { ink: '#7e97b5', lit: '#9fb6ce', hatch: '#b3c4d4', shade: '#90a0b0' };

    // Top right, and running off the right-hand edge on purpose. A cloud that
    // stops neatly inside the frame is a drawing of a cloud; one that leaves
    // the page is weather. The canvas clips it for free.
    const CX0 = 0.74 * w, CX1 = 1.09 * w, CY0 = 0.07 * h, CY1 = 0.28 * h;
    const CW = CX1 - CX0, CH = CY1 - CY0;
    const P = ([tx, ty]) => [CX0 + tx * CW, CY0 + ty * CH];

    // The silhouette, written out in box coordinates (0..1 across, 0..1 down)
    // rather than generated. The shape wanted here is not a row of equal bumps:
    // it has a rounded head at the left, a flattish top that only undulates,
    // and a scalloped underside that drops away as it goes right. A generator
    // flexible enough to say all that would be longer than the path is.
    const CTOP = [
      [0.00, 0.42], [0.01, 0.28], [0.05, 0.14], [0.11, 0.05], [0.19, 0.02],
      [0.26, 0.08], [0.30, 0.18], [0.36, 0.09], [0.44, 0.02], [0.53, 0.00],
      [0.61, 0.05], [0.66, 0.14], [0.72, 0.07], [0.80, 0.03], [0.88, 0.06],
      [0.95, 0.12], [1.00, 0.20],
    ];
    // Left to right, same as the top, so the two can be read against each
    // other. The outline walks it backwards to close the shape.
    const CBOT = [
      [0.00, 0.42], [0.02, 0.54], [0.06, 0.68], [0.11, 0.84], [0.17, 0.80],
      [0.23, 0.92], [0.29, 0.85], [0.35, 0.96], [0.41, 0.88], [0.47, 0.99],
      [0.54, 0.90], [0.60, 1.00], [0.66, 0.90], [0.72, 1.00], [0.78, 0.89],
      [0.84, 0.99], [0.90, 0.88], [0.95, 0.97], [1.00, 0.86],
    ];
    const outline = [...CTOP.map(P), ...CBOT.slice().reverse().map(P)];

    // Where the top and bottom edges are at a given point across the cloud,
    // by walking the path. The hatch is clipped between them.
    //
    // The first version approximated the top with a bell curve, on the theory
    // that the exact silhouette was not worth computing. It was: wherever the
    // bell sat above the real outline the hatch came out through the roof, and
    // bumps with spikes rising out of them is a mountain range, not a cloud.
    const edgeAt = (arr, t) => {
      for (let i = 1; i < arr.length; i++) {
        if (t <= arr[i][0]) {
          const [x0, y0] = arr[i - 1], [x1, y1] = arr[i];
          const k = x1 === x0 ? 0 : (t - x0) / (x1 - x0);
          return y0 + (y1 - y0) * k;
        }
      }
      return arr[arr.length - 1][1];
    };

    // Jitter is tuned to the letters, which are 270-odd pixels tall; on a bump
    // of 50 the same wobble is proportionally six times coarser and turns the
    // curve into a sawtooth. Everything in the cloud asks for a fraction of it.
    const CO = Math.max(1, R * 0.005);
    const cdx = (Math.random() - 0.5) * 2 * CO, cdy = (Math.random() - 0.5) * 2 * CO;
    add(CLOUD.ink, outline, Math.max(2, R * 0.010), 10, 0.3);
    add(CLOUD.lit, outline.map(([x, y]) => [x + cdx, y + cdy]), Math.max(2, R * 0.008), 8, 0.3);

    // The hatch: long diagonals leaning up to the right, the way a hand fills a
    // shape quickly without lifting much. Each runs between the two edges with
    // an inset, so none of them can reach the outline, let alone cross it.
    for (let i = 0; i < 7; i++) {
      const t0 = 0.08 + (i / 7) * 0.80;
      const t1 = Math.min(0.99, t0 + 0.13);            // leans right as it rises
      const band = edgeAt(CBOT, t0) - edgeAt(CTOP, t1);
      if (band < 0.3) continue;                        // too thin to take a stroke
      const low = i % 3 === 1;                         // one in three is the darker tone
      const lo = edgeAt(CBOT, t0) - 0.1;
      const hi = edgeAt(CTOP, t1) + (low ? 0.34 : 0.14);
      add(low ? CLOUD.shade : CLOUD.hatch,
        [P([t0, lo]), P([t1, hi])],
        Math.max(2, R * (low ? 0.008 : 0.006)), 6, 0.25);
    }

    // Gulls. Three rather than two, at three sizes and three heights - two the
    // same size on one line reads as a pattern instead of as birds.
    const gull = (gx, gy, gs) => add('#000000', [
      [gx - gs, gy], [gx - gs * 0.45, gy - gs * 0.52], [gx, gy - gs * 0.1],
      [gx + gs * 0.45, gy - gs * 0.52], [gx + gs, gy],
    ], Math.max(3, R * 0.015), 17);
    // One crossing the cloud, two in clear sky. All three on it was a row of
    // birds pinned to one object - the overlap stopped being a depth cue and
    // became a texture. One crossing is enough to say which is in front, and
    // the other two then have somewhere to be.
    //
    // Size falls off with height, so the low one reads as nearest and the high
    // one as furthest. That does more for the depth than the overlap does.
    gull(0.30 * w, 0.145 * h, 0.050 * R);   // open sky, clear of the sun's rays
    gull(0.82 * w, 0.205 * h, 0.070 * R);   // crossing the cloud, lowest and largest
    gull(0.55 * w, 0.085 * h, 0.038 * R);   // high and small, well clear of both

    // Grass: three long wandering lines rather than one, at different heights
    // and phases, so they cross each other the way a scribbled horizon does.
    // freq is how many times the line waves across the page. Each blade gets
    // its own, because lines sharing a frequency stay the same distance apart
    // the whole way across however you shift their phase - five of those is one
    // shape drawn five times. Different frequencies make them converge, cross
    // and open out, which is what fills the band.
    const blade = (y0, amp, phase, color, freq) => {
      const pts = [];
      for (let i = 0; i <= 24; i++) {
        const t = i / 24;
        pts.push([
          (0.04 + t * 0.92) * w,
          y0 + Math.sin(t * freq + phase) * amp + (Math.random() - 0.5) * amp * 0.9,
        ]);
      }
      // 9 was the pace when there were three of these. At five it is 125 points
      // of waiting at the end of the animation, long after the word is made and
      // there is nothing left to find out. 9 / 1.3 - a third quicker.
      add(color, pts, Math.max(3, R * 0.012), 7);
    };
    // Grown up to the lettering so the top line just catches it.
    //
    // Measured from the word, not from the canvas. The word's position already
    // moves with FILL and DROP and with the window's shape, so grass pinned to
    // a fraction of the height would drift away from it - it only happened to
    // sit right at one size. gTop is where the tallest peaks reach: a little
    // ABOVE the baseline of the letters, which is what makes it touch rather
    // than stop politely underneath.
    //
    // Only the top line gets there, and only at its peaks - and since the peaks
    // fall where the wave puts them rather than where the letters are, some
    // catch a stem and some pass through the gaps. That is the part that reads
    // as grass rather than as a border.
    const wordBottom = (by + bh) * scale + offY;
    const gTop = wordBottom - Math.max(3, h * 0.006);
    const gBot = h * 0.95;
    // Five lines, darkest at the back and palest at the front, each a little
    // deeper in wave than the one behind it. The spacing is worked out from the
    // count rather than written down, so adding a sixth needs one more row.
    [
      { amp: 0.022 * h, phase: 0.0, freq: 13, color: '#156b22' },
      { amp: 0.024 * h, phase: 1.7, freq: 9,  color: '#1a7a28' },
      { amp: 0.027 * h, phase: 3.1, freq: 16, color: '#1f8a2e' },
      { amp: 0.030 * h, phase: 4.6, freq: 11, color: '#249639' },
      { amp: 0.032 * h, phase: 5.9, freq: 14, color: '#2aa33a' },
    ].forEach((b, i, all) => {
      const k = i / (all.length - 1);
      blade(gTop + b.amp + k * (gBot - gTop - b.amp * 2), b.amp, b.phase, b.color, b.freq);
    });

    // Every dark stroke, then every bright one, then the world around them.
    const passes = [...flat, ...overs, ...scene];

    const state = { i: 0, j: 0, t1: 0, t2: 0, cancelled: false };
    introState = state;

    // Bolder than a pencil line, and measured against the letters rather than
    // against the canvas - the letters are what the stroke has to look right
    // on, and now that they resize to fit, a weight tied to the window would
    // drift away from them. About a thirteenth of the cap height is a marker
    // pen; much thinner and the word goes back to looking like a stray mark.
    const weight = Math.max(3, Math.round(capPx * 0.075));
    // Enough wobble to read as a hand, not enough to bend the letterforms. Tied
    // to the cap height for the same reason, and small against it - at this
    // size a wobble proportional to the stroke would be several percent of a
    // letter and the uprights would visibly lean.
    const jitter = (k = 1) => (Math.random() - 0.5) * Math.max(1.5, capPx * 0.03) * k;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const step = () => {
      if (state.cancelled || state.i >= passes.length) { introState = null; return; }
      const s = passes[state.i];
      ctx.strokeStyle = s.color;
      // The going-over is a shade thinner. A second pull at the full weight
      // just widens the letter; thinner, it reads as a line laid inside the
      // one already there.
      ctx.lineWidth = s.w || (s.over ? Math.max(2, weight * 0.78) : weight);
      if (state.j === 0) {
        ctx.beginPath();
        ctx.moveTo(s.pts[0][0] + jitter(s.jit), s.pts[0][1] + jitter(s.jit));
        state.j = 1;
      }
      if (state.j < s.pts.length) {
        ctx.lineTo(s.pts[state.j][0] + jitter(s.jit), s.pts[state.j][1] + jitter(s.jit));
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(s.pts[state.j][0] + jitter(s.jit), s.pts[state.j][1] + jitter(s.jit));
        state.j++;
      } else {
        state.i++; state.j = 0;
      }
      // The second pull is quicker than the first. Doubling the strokes would
      // otherwise double how long the word takes to appear, and going back over
      // a line you have already drawn is a faster movement anyway - you are not
      // deciding where it goes any more.
      //
      // A beat at each handover - word finished and the bright pen about to
      // start, then word finished again and the scene about to. Without them
      // the three runs join into one long scribble and the word is never seen
      // on its own at all.
      const betweenPasses = state.j === 0 &&
        (state.i === flat.length || state.i === flat.length + overs.length);
      state.t2 = setTimeout(() => requestAnimationFrame(step),
        betweenPasses ? 520
          : s.d ? s.d + Math.random() * s.d
          : s.over ? 17 + Math.random() * 20
          : 20 + Math.random() * 30);
    };
    state.t1 = setTimeout(() => requestAnimationFrame(step), 400);
  }
})();
</script>
</body>
</html>
