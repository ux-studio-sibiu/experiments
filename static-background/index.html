<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Static background — menu overlay concept</title>
<style>
  :root { --ink: #f4f4f2; --bg: #0a0a0b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* the static effect lives here — a full-screen background layer on the MAIN
     screen, behind the page content. */
  #bg { position: fixed; inset: 0; z-index: 0; }

  /* page content sits above the static background */
  .page { position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; padding: 24px; }
  .page h1 { font-size: clamp(40px, 9vw, 120px); font-weight: 600; letter-spacing: -0.03em; margin: 0; opacity: .9; }
  .page p  { position: fixed; left: 24px; bottom: 22px; font-size: 13px; opacity: .5; max-width: 40ch; line-height: 1.5; }

  /* top bar */
  .bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10001;
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 28px; mix-blend-mode: difference; color: #fff;
  }
  .brand { font-weight: 600; letter-spacing: .02em; font-size: 15px; }
  .menu-btn {
    appearance: none; background: none; border: none; color: inherit; cursor: pointer;
    font: inherit; font-size: 15px; letter-spacing: .08em; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 10px; padding: 6px 0;
  }
  .menu-btn .bars { display: inline-flex; flex-direction: column; gap: 4px; }
  .menu-btn .bars i { width: 22px; height: 1.5px; background: currentColor; transition: transform .3s ease, opacity .3s ease; }
  body.menu-open .menu-btn .bars i:nth-child(1) { transform: translateY(5.5px) rotate(45deg); }
  body.menu-open .menu-btn .bars i:nth-child(2) { opacity: 0; }
  body.menu-open .menu-btn .bars i:nth-child(3) { transform: translateY(-5.5px) rotate(-45deg); }

  /* the menu overlay — plain navigation panel (the static lives on #bg now) */
  .overlay {
    position: fixed; inset: 0; z-index: 10000;
    background: #08080a;
    opacity: 0; visibility: hidden;
    transition: opacity .45s ease, visibility 0s linear .45s;
  }
  body.menu-open .overlay { opacity: 1; visibility: visible; transition: opacity .45s ease; }

  .nav {
    position: relative; z-index: 2;
    height: 100%; display: flex; flex-direction: column; justify-content: center;
    gap: 6px; padding: 0 8vw;
  }
  .nav a {
    color: var(--ink); text-decoration: none; font-weight: 600; letter-spacing: -0.02em;
    font-size: clamp(34px, 7vw, 84px); line-height: 1.05; width: max-content;
    opacity: 0; transform: translateY(18px);
    /* Only the entrance reveal animates. Hover colour is intentionally NOT in
       this list, so :hover feedback is instant (0ms) — fast, responsive UI. */
    transition: opacity .5s ease, transform .5s ease;
  }
  .nav a:hover { color: #9a9a93; } /* instant — no color transition on purpose */
  body.menu-open .nav a { opacity: 1; transform: none; }
  body.menu-open .nav a:nth-child(1) { transition-delay: .10s; }
  body.menu-open .nav a:nth-child(2) { transition-delay: .16s; }
  body.menu-open .nav a:nth-child(3) { transition-delay: .22s; }
  body.menu-open .nav a:nth-child(4) { transition-delay: .28s; }

  /* live controls */
  .controls {
    position: fixed; right: 16px; bottom: 16px; z-index: 10002; font-size: 12px; color: #cfcfd2;
    background: rgba(20,20,22,.6); padding: 12px 14px; border-radius: 10px;
    backdrop-filter: blur(8px); display: grid; gap: 8px; min-width: 230px;
  }
  .controls label { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
  .controls input[type=range] { width: 130px; }
  .controls .row { display:flex; gap:8px; align-items:center; justify-content: space-between; }
  .controls select { background:#1b1b1e; color:#eee; border:1px solid #333; border-radius:6px; padding:3px 6px; }
  .controls button { flex:1; background:#1b1b1e; color:#eee; border:1px solid #333; border-radius:6px; padding:4px 6px; cursor:pointer; font:inherit; }
  .controls button:hover { background:#2a2a2e; }
</style>
</head>
<body>
  <div id="bg"></div>

  <main class="page">
    <h1>New Form</h1>
    <p>Animated static runs as the page background. Tweak it with the panel, or
       blend in a background image (upload one, or try <em>gradient</em>/<em>sample</em>).</p>
  </main>

  <header class="bar">
    <span class="brand">◈ STATIC/BG</span>
    <button class="menu-btn" id="menuBtn" aria-expanded="false">
      <span id="menuLabel">Menu</span>
      <span class="bars"><i></i><i></i><i></i></span>
    </button>
  </header>

  <div class="overlay" id="overlay" aria-hidden="true">
    <nav class="nav">
      <a href="#">Work</a>
      <a href="#">Studio</a>
      <a href="#">Approach</a>
      <a href="#">Contact</a>
    </nav>
  </div>

  <aside class="controls">
    <div class="row"><strong>static-background</strong></div>
    <label>opacity <input id="c_opacity" type="range" min="0" max="1" step="0.01" value="0.30"></label>
    <label>fps <input id="c_fps" type="range" min="6" max="60" step="1" value="24"></label>
    <label>cell size <input id="c_cell" type="range" min="1" max="6" step="0.5" value="3"></label>
    <label>density <input id="c_density" type="range" min="0.05" max="1" step="0.05" value="1"></label>
    <label class="row">image <input id="c_image" type="file" accept="image/*" style="font-size:11px; max-width:120px;"></label>
    <div class="row">
      <button id="c_gradient" type="button">gradient</button>
      <button id="c_sample" type="button">sample</button>
      <button id="c_clear" type="button">clear</button>
    </div>
    <label class="row">fit
      <select id="c_fit">
        <option value="cover" selected>cover</option>
        <option value="contain">contain</option>
        <option value="fill">fill</option>
      </select>
    </label>
    <label class="row">grain mix
      <select id="c_grain">
        <option value="overlay" selected>overlay</option>
        <option value="soft-light">soft-light</option>
        <option value="screen">screen</option>
        <option value="source-over">normal</option>
      </select>
    </label>
    <label class="row">canvas blend
      <select id="c_blend">
        <option value="normal" selected>normal</option>
        <option value="screen">screen</option>
        <option value="overlay">overlay</option>
        <option value="soft-light">soft-light</option>
      </select>
    </label>
    <label class="row">tint
      <select id="c_color">
        <option value="" selected>grayscale</option>
        <option value="120,200,255">cyan</option>
        <option value="255,150,90">amber</option>
        <option value="120,255,160">green</option>
      </select>
    </label>
  </aside>

<script>
// ===========================================================================
//  Inlined copy of static-background.js so this demo works when opened from
//  disk (file://). The canonical, importable version is static-background.js —
//  keep the two in sync if you edit the algorithm.
// ===========================================================================
const DEFAULTS = {
  container: null, opacity: 0.10, fps: 24, cellSize: 1.5, density: 1,
  color: null, image: null, imageFit: 'cover', grainBlend: 'overlay',
  background: 'transparent', blendMode: 'normal', fade: 320,
  zIndex: 9999, passthrough: true, autostart: false, respectReducedMotion: true,
};

function createStaticBackground(opts = {}) {
  const cfg = { ...DEFAULTS, ...opts };
  const container = cfg.container || document.body;

  const reducedMotion =
    cfg.respectReducedMotion &&
    typeof window.matchMedia === 'function' &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const canvas = document.createElement('canvas');
  const s = canvas.style;
  s.position = 'absolute'; s.inset = '0'; s.width = '100%'; s.height = '100%';
  s.display = 'block'; s.zIndex = String(cfg.zIndex);
  s.pointerEvents = cfg.passthrough ? 'none' : 'auto';
  s.mixBlendMode = cfg.blendMode; s.opacity = '0';
  s.transition = `opacity ${cfg.fade}ms ease`;

  const ctx = canvas.getContext('2d');
  container.appendChild(canvas);

  const buffer = document.createElement('canvas');
  const bctx = buffer.getContext('2d');
  let imageData = null;
  let cssW = 0, cssH = 0, bufW = 0, bufH = 0;

  let imgEl = null, imgReady = false;

  function setImage(src) {
    if (!src) { imgEl = null; imgReady = false; if (!running) renderFrame(); return; }
    if (src instanceof HTMLImageElement || src instanceof HTMLCanvasElement) {
      imgEl = src;
      imgReady = !!(src.complete ?? true) && (src.naturalWidth || src.width) > 0;
      if (!imgReady && src.addEventListener) {
        src.addEventListener('load', () => { imgReady = true; if (!running) renderFrame(); }, { once: true });
      } else if (!running) renderFrame();
      return;
    }
    const im = new Image();
    im.decoding = 'async';
    im.onload = () => { if (imgEl === im) { imgReady = true; if (!running) renderFrame(); } };
    im.onerror = () => { if (imgEl === im) { imgEl = null; imgReady = false; } };
    imgEl = im; imgReady = false; im.src = src;
  }

  function drawImageFit(img) {
    const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    if (!iw || !ih) return;
    if (cfg.imageFit === 'fill') { ctx.drawImage(img, 0, 0, cssW, cssH); return; }
    const cr = cssW / cssH, ir = iw / ih;
    let dw, dh;
    if (cfg.imageFit === 'contain' ? ir > cr : ir < cr) { dw = cssW; dh = cssW / ir; }
    else { dh = cssH; dw = cssH * ir; }
    ctx.drawImage(img, (cssW - dw) / 2, (cssH - dh) / 2, dw, dh);
  }

  function resize() {
    cssW = container.clientWidth || window.innerWidth;
    cssH = container.clientHeight || window.innerHeight;
    canvas.width = cssW; canvas.height = cssH;
    bufW = Math.max(1, Math.ceil(cssW / cfg.cellSize));
    bufH = Math.max(1, Math.ceil(cssH / cfg.cellSize));
    buffer.width = bufW; buffer.height = bufH;
    imageData = bctx.createImageData(bufW, bufH);
    if (reducedMotion || !running) renderFrame();
  }

  function fillNoiseBuffer() {
    const data = imageData.data;
    const n = bufW * bufH;
    const tint = cfg.color;
    const density = cfg.density;
    for (let i = 0; i < n; i++) {
      const o = i << 2;
      if (density < 1 && Math.random() > density) { data[o + 3] = 0; continue; }
      const v = (Math.random() * 256) | 0;
      if (tint) {
        data[o]     = (tint[0] * v) >> 8;
        data[o + 1] = (tint[1] * v) >> 8;
        data[o + 2] = (tint[2] * v) >> 8;
      } else {
        data[o] = data[o + 1] = data[o + 2] = v;
      }
      data[o + 3] = 255;
    }
    bctx.putImageData(imageData, 0, 0);
  }

  function renderFrame() {
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, cssW, cssH);
    const hasColour = cfg.background && cfg.background !== 'transparent';
    if (hasColour) { ctx.fillStyle = cfg.background; ctx.fillRect(0, 0, cssW, cssH); }
    if (imgEl && imgReady) { ctx.imageSmoothingEnabled = true; drawImageFit(imgEl); }
    const hasBase = hasColour || (imgEl && imgReady);

    fillNoiseBuffer();
    ctx.imageSmoothingEnabled = false;
    ctx.globalAlpha = cfg.opacity;
    ctx.globalCompositeOperation = hasBase ? cfg.grainBlend : 'source-over';
    ctx.drawImage(buffer, 0, 0, bufW, bufH, 0, 0, cssW, cssH);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }

  let rafId = 0, running = false, visible = false, lastFrame = -Infinity;

  function frame(ts) {
    if (!running) return;
    const interval = 1000 / cfg.fps;
    if (ts - lastFrame >= interval) { lastFrame = ts; renderFrame(); }
    rafId = requestAnimationFrame(frame);
  }
  function start() {
    if (running || reducedMotion) { if (reducedMotion) renderFrame(); return api; }
    running = true; lastFrame = -Infinity;
    rafId = requestAnimationFrame(frame); return api;
  }
  function stop() { running = false; cancelAnimationFrame(rafId); return api; }

  function show() { visible = true; s.opacity = '1'; start(); return api; }
  function hide() {
    visible = false; s.opacity = '0';
    clearTimeout(hide._t);
    hide._t = setTimeout(() => { if (!visible) stop(); }, cfg.fade + 50);
    return api;
  }
  function toggle(force) {
    const next = typeof force === 'boolean' ? force : !visible;
    return next ? show() : hide();
  }
  function onVisibilityChange() {
    if (document.hidden) stop(); else if (visible) start();
  }

  const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(resize) : null;
  if (ro) ro.observe(container); else window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', onVisibilityChange);

  const api = {
    canvas, show, hide, toggle, start, stop, resize, setImage,
    get visible() { return visible; },
    set(name, value) {
      if (name === 'image') { setImage(value); return api; }
      if (!(name in cfg)) return api;
      cfg[name] = value;
      switch (name) {
        case 'blendMode':  s.mixBlendMode = value; break;
        case 'zIndex':     s.zIndex = String(value); break;
        case 'cellSize':   resize(); break;
        case 'passthrough': s.pointerEvents = value ? 'none' : 'auto'; break;
        default: break;
      }
      if (!running) renderFrame();
      return api;
    },
    destroy() {
      stop(); clearTimeout(hide._t);
      if (ro) ro.disconnect(); else window.removeEventListener('resize', resize);
      document.removeEventListener('visibilitychange', onVisibilityChange);
      if (canvas.parentNode === container) container.removeChild(canvas);
    },
  };

  // Init AFTER `api` exists — show()/start() reference `api` (TDZ otherwise).
  if (cfg.image) setImage(cfg.image);
  resize();
  if (cfg.autostart) show();

  return api;
}

// --- demo wiring -----------------------------------------------------------
// Static runs on the MAIN screen as a persistent background. Presets tuned for
// the stronger / coarser TV-static look: chunky cells, dense, fairly opaque.
const fx = createStaticBackground({
  container: document.getElementById('bg'),
  opacity: 0.30,     // strong
  cellSize: 3,       // coarse / blocky
  density: 1,        // dense snow
  fps: 24,
  autostart: true,
});
window.fx = fx; // expose for quick console tinkering in the demo

// The menu is now just navigation — no static attached to it.
const overlay = document.getElementById('overlay');
const btn = document.getElementById('menuBtn');
const label = document.getElementById('menuLabel');
let open = false;
function setMenu(next) {
  open = next;
  document.body.classList.toggle('menu-open', open);
  btn.setAttribute('aria-expanded', String(open));
  overlay.setAttribute('aria-hidden', String(!open));
  label.textContent = open ? 'Close' : 'Menu';
}
btn.addEventListener('click', () => setMenu(!open));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && open) setMenu(false); });

// --- controls --------------------------------------------------------------
const $ = (id) => document.getElementById(id);
$('c_opacity').addEventListener('input', (e) => fx.set('opacity', +e.target.value));
$('c_fps').addEventListener('input',     (e) => fx.set('fps', +e.target.value));
$('c_cell').addEventListener('input',    (e) => fx.set('cellSize', +e.target.value));
$('c_density').addEventListener('input', (e) => fx.set('density', +e.target.value));
$('c_blend').addEventListener('change',  (e) => fx.set('blendMode', e.target.value));
$('c_color').addEventListener('change',  (e) => {
  const v = e.target.value;
  fx.set('color', v ? v.split(',').map(Number) : null);
});

// --- background image controls ---------------------------------------------
$('c_fit').addEventListener('change',   (e) => fx.set('imageFit', e.target.value));
$('c_grain').addEventListener('change', (e) => fx.set('grainBlend', e.target.value));

// Track the active object URL so we can revoke the PREVIOUS one when switching —
// never the one we're about to hand to the image loader.
let objectUrl = null;
function revokeCurrent() {
  if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
}

$('c_image').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  revokeCurrent();
  objectUrl = URL.createObjectURL(f);
  fx.setImage(objectUrl);     // loader keeps a reference; safe to revoke later
});

// Procedurally generated image — works fully offline, no assets, no network.
$('c_gradient').addEventListener('click', () => {
  revokeCurrent();
  const c = document.createElement('canvas');
  c.width = 1600; c.height = 1000;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, c.width, c.height);
  grad.addColorStop(0, '#1d4ed8'); grad.addColorStop(0.5, '#9333ea'); grad.addColorStop(1, '#f97316');
  g.fillStyle = grad; g.fillRect(0, 0, c.width, c.height);
  fx.setImage(c);             // pass the canvas element straight through
});

// Network sample (graceful no-op offline); good for trying grain-over-photo.
$('c_sample').addEventListener('click', () => { revokeCurrent(); fx.setImage('https://picsum.photos/seed/static/1600/1000'); });

$('c_clear').addEventListener('click', () => {
  revokeCurrent();
  fx.setImage(null);
  $('c_image').value = '';
});
</script>
</body>
</html>
