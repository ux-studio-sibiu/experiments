<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Fluid hover — concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!-- the randomize-studio's panel, copied in (see style.css) -->
<link rel="stylesheet" href="vendor/randomize-studio/css/panel.css">
<link rel="stylesheet" href="vendor/randomize-studio/css/controls.css">

</head>
<body>
<div id="app"></div>

<button id="panelShow" data-mark="plus">Maximize edit panel</button>
<aside class="panel" id="panel">
  <div class="phead">
    <b>Fluid hover</b>
    <span class="spacer"></span>
    <button id="panelToggle" class="iconbtn" data-mark="minus" title="Minimize"></button>
  </div>
  <div class="pbody">
    <div class="grp">
      <h3>Smear
        <button id="copySettings" class="iconbtn" data-mark="copy" title="Copy settings" aria-label="Copy settings"></button></h3>
      <div class="row"><label>strength</label><input id="u_strength" type="range" min="0" max="0.6" step="0.005" value="0.18"><output id="u_strengthV"></output></div>
      <div class="row"><label>radius</label><input id="u_radius" type="range" min="2" max="40" step="0.5" value="9"><output id="u_radiusV"></output></div>
      <div class="row"><label>decay</label><input id="u_decay" type="range" min="0.80" max="0.995" step="0.001" value="0.94"><output id="u_decayV"></output></div>
      <div class="row"><label>chroma</label><input id="u_chroma" type="range" min="0" max="0.04" step="0.001" value="0.012"><output id="u_chromaV"></output></div>
      <div class="row"><label>mono</label><span></span><input id="u_mono" type="checkbox" title="The photo in black and white, the smear's colour fringes kept"></div>
    </div>
    <div class="grp">
      <h3>Image</h3>
      <!-- photos to pick from, as tiles (the studio's .pat-grid); the full-size image loads on pick -->
      <div class="pat-grid photos" id="photoGrid" aria-label="Photos"></div>
      <div class="pat-current" id="photoName"></div>
      <div class="btnrow">
        <button id="randomPhoto" data-mark="randomize">Random photo</button>
        <label class="uploadbtn" data-mark="upload">Upload<input id="u_file" type="file" accept="image/*" hidden></label>
      </div>
    </div>
  </div>
</aside>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
// `createFluidHover` is inlined below from fluid-hover.js so this page works
// when opened directly from disk (file://). Browsers block ES-module fetches
// of sibling files under file:// for CORS reasons (null origin). Three.js is
// fine because unpkg sends CORS headers. Keep fluid-hover.js in sync if you
// edit either copy — the standalone module is still the canonical version
// for bundling/import use.

import * as THREE from 'three';

const VERT = /* glsl */`
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = vec4(position.xy, 0.0, 1.0);
  }
`;

const FRAG = /* glsl */`
  precision highp float;
  varying vec2 vUv;

  uniform sampler2D uTex;
  uniform sampler2D uOverlay;
  uniform vec2  uTexSize;
  uniform vec2  uResolution;
  uniform vec2  uMouse;
  uniform vec2  uMouseVel;
  uniform float uStrength;
  uniform float uRadius;
  uniform float uChroma;
  uniform float uMono;   // 1: the image in black and white, the smear's colour fringes still in colour
  uniform float uTime;

  vec2 coverUv(vec2 uv, vec2 res, vec2 tex) {
    float rRes = res.x / res.y;
    float rTex = tex.x / tex.y;
    vec2 scale = (rRes > rTex)
      ? vec2(1.0, rTex / rRes)
      : vec2(rRes / rTex, 1.0);
    return (uv - 0.5) * scale + 0.5;
  }

  float aspectDist(vec2 a, vec2 b, vec2 res) {
    vec2 d = (a - b) * vec2(res.x / res.y, 1.0);
    return length(d);
  }

  void main() {
    vec2 uv = vUv;
    float d = aspectDist(uv, uMouse, uResolution);
    float falloff = exp(-uRadius * d);

    vec2 disp = uMouseVel * uStrength * falloff;
    vec2 pull = (uMouse - uv) * 0.15 * falloff;

    vec2 sampleUv = coverUv(uv + disp + pull, uResolution, uTexSize);

    float ca = uChroma * falloff * (0.5 + length(uMouseVel) * 6.0);
    vec2 dir = normalize(uMouseVel + vec2(1e-6));
    vec2 caShift = dir * ca;

    // Each channel is sampled at its own shift. With uMono, each reads the image's brightness instead of its own
    // colour: where nothing is shifted the three agree and the picture is grey; where the smear pulls them
    // apart they differ, and the fringes come out in colour.
    vec3 lumaW = vec3(0.2126, 0.7152, 0.0722);
    vec3 cR = texture2D(uTex, coverUv(uv + disp + pull + caShift, uResolution, uTexSize)).rgb;
    vec3 cG = texture2D(uTex, sampleUv).rgb;
    vec3 cB = texture2D(uTex, coverUv(uv + disp + pull - caShift, uResolution, uTexSize)).rgb;
    float r = mix(cR.r, dot(cR, lumaW), uMono);
    float g = mix(cG.g, dot(cG, lumaW), uMono);
    float b = mix(cB.b, dot(cB, lumaW), uMono);
    vec3 bg = vec3(r, g, b);

    vec2 ovUv = uv + disp + pull;
    float or_ = texture2D(uOverlay, ovUv + caShift).r;
    float og  = texture2D(uOverlay, ovUv          ).g;
    float ob  = texture2D(uOverlay, ovUv - caShift).b;
    float oa  = texture2D(uOverlay, ovUv          ).a;

    vec3 outc = mix(bg, vec3(or_, og, ob), oa);
    gl_FragColor = vec4(outc, 1.0);
  }
`;

function roundRectPath(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y,     x + w, y + h, r);
  c.arcTo(x + w, y + h, x,     y + h, r);
  c.arcTo(x,     y + h, x,     y,     r);
  c.arcTo(x,     y,     x + w, y,     r);
  c.closePath();
}

function createFluidHover(opts = {}) {
  const {
    container,
    image = null,
    buttons = [],
    clearColor = 0x0b0b0c,
    strength = 0.18,
    radius   = 9.0,
    chroma   = 0.012,
    mono     = false,   // the image in black and white, the smear's colour fringes kept
    decay    = 0.94,
    buttonsAt = 0.5,   // where the button row's centre sits, as a share of the height (0.5 = the middle)
    buttonStyle = {
      width: 260, height: 80, gap: 28, fontSize: 22,
      fontWeight: 600, fontFamily: 'ui-sans-serif, system-ui, sans-serif',
      fillPrimary:   'rgba(255,255,255,0.92)',
      fillSecondary: 'rgba(15,15,17,0.35)',
      stroke:        'rgba(255,255,255,0.85)',
      textPrimary:   '#0b0b0c',
      textSecondary: '#ffffff',
    },
  } = opts;

  if (!container) throw new Error('createFluidHover: `container` is required');

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(clearColor, 1);
  container.appendChild(renderer.domElement);

  const scene  = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

  const overlay  = document.createElement('canvas');
  const octx     = overlay.getContext('2d');
  const overlayTex = new THREE.CanvasTexture(overlay);
  overlayTex.colorSpace       = THREE.SRGBColorSpace;
  overlayTex.minFilter        = THREE.LinearFilter;
  overlayTex.magFilter        = THREE.LinearFilter;
  overlayTex.generateMipmaps  = false;
  overlayTex.premultiplyAlpha = false;

  const uniforms = {
    uTex:        { value: null },
    uTexSize:    { value: new THREE.Vector2(1, 1) },
    uResolution: { value: new THREE.Vector2(1, 1) },
    uMouse:      { value: new THREE.Vector2(0.5, 0.5) },
    uMouseVel:   { value: new THREE.Vector2(0, 0) },
    uStrength:   { value: strength },
    uRadius:     { value: radius },
    uChroma:     { value: chroma },
    uMono:       { value: mono ? 1 : 0 },
    uTime:       { value: 0 },
    uOverlay:    { value: overlayTex },
  };

  const material = new THREE.ShaderMaterial({ uniforms, vertexShader: VERT, fragmentShader: FRAG });
  const geometry = new THREE.PlaneGeometry(2, 2);
  const quad = new THREE.Mesh(geometry, material);
  scene.add(quad);

  const loader = new THREE.TextureLoader();
  loader.setCrossOrigin('anonymous');

  function applyTexture(tex) {
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.generateMipmaps = false;
    tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    if (uniforms.uTex.value) uniforms.uTex.value.dispose();
    uniforms.uTex.value = tex;
    const img = tex.image;
    uniforms.uTexSize.value.set(
      img.width  || img.naturalWidth  || 1,
      img.height || img.naturalHeight || 1,
    );
  }

  function setImage(src) {
    if (!src) return;
    if (src instanceof HTMLImageElement || src instanceof HTMLCanvasElement) {
      applyTexture(new THREE.Texture(src));
      uniforms.uTex.value.needsUpdate = true;
      return;
    }
    loader.load(src, applyTexture, undefined, () => { /* offline-safe */ });
  }
  if (image) setImage(image);

  const items = buttons.map((b) => ({ ...b, rect: { x: 0, y: 0, w: 0, h: 0 } }));
  let hoverIdx = -1;

  function layoutButtons() {
    const dpr = renderer.getPixelRatio();
    const W = overlay.width, H = overlay.height;
    const bw  = buttonStyle.width  * dpr;
    const bh  = buttonStyle.height * dpr;
    const gap = buttonStyle.gap    * dpr;
    const cy = H * buttonsAt - bh / 2;
    const cx = W / 2;

    const total = items.length * bw + Math.max(0, items.length - 1) * gap;
    let x = cx - total / 2;
    for (const it of items) {
      it.rect.x = x; it.rect.y = cy; it.rect.w = bw; it.rect.h = bh;
      x += bw + gap;
    }
  }

  function drawOverlay() {
    const dpr = renderer.getPixelRatio();
    octx.clearRect(0, 0, overlay.width, overlay.height);
    octx.font = `${buttonStyle.fontWeight} ${buttonStyle.fontSize * dpr}px ${buttonStyle.fontFamily}`;
    octx.textAlign = 'center';
    octx.textBaseline = 'middle';

    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      const r  = it.rect;
      const hovered = i === hoverIdx;
      const filled = !!it.primary !== hovered;
      octx.fillStyle   = filled ? buttonStyle.fillPrimary : buttonStyle.fillSecondary;
      octx.strokeStyle = buttonStyle.stroke;
      octx.lineWidth   = 1 * dpr;
      roundRectPath(octx, r.x, r.y, r.w, r.h, r.h / 2);
      octx.fill();
      octx.stroke();
      octx.fillStyle = filled ? buttonStyle.textPrimary : buttonStyle.textSecondary;
      octx.fillText(it.label, r.x + r.w / 2, r.y + r.h / 2 + 1 * dpr);
    }
    overlayTex.needsUpdate = true;
  }

  function hitTest(cssX, cssY) {
    const dpr = renderer.getPixelRatio();
    const x = cssX * dpr, y = cssY * dpr;
    for (let i = 0; i < items.length; i++) {
      const r = items[i].rect;
      if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return i;
    }
    return -1;
  }

  const target = new THREE.Vector2(0.5, 0.5);
  const prev   = new THREE.Vector2(0.5, 0.5);
  let decayValue = decay;

  function onPointerMove(e) {
    const rect = renderer.domElement.getBoundingClientRect();
    const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
    target.x = cx / rect.width;
    target.y = 1.0 - cy / rect.height;

    const i = hitTest(cx, cy);
    if (i !== hoverIdx) {
      hoverIdx = i;
      drawOverlay();
      renderer.domElement.classList.toggle('hot', i >= 0);
    }
  }

  function onClick(e) {
    const rect = renderer.domElement.getBoundingClientRect();
    const i = hitTest(e.clientX - rect.left, e.clientY - rect.top);
    if (i >= 0 && typeof items[i].onClick === 'function') items[i].onClick();
  }

  window.addEventListener('pointermove', onPointerMove);
  renderer.domElement.addEventListener('click', onClick);

  function resize() {
    const w = container.clientWidth  || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    const dpr = renderer.getPixelRatio();
    renderer.setSize(w, h);
    uniforms.uResolution.value.set(w, h);
    overlay.width  = Math.max(1, Math.floor(w * dpr));
    overlay.height = Math.max(1, Math.floor(h * dpr));
    layoutButtons();
    drawOverlay();
  }
  window.addEventListener('resize', resize);
  resize();

  const clock = new THREE.Clock();
  let rafId = 0;
  let running = true;

  function tick() {
    if (!running) return;
    const dt = Math.min(clock.getDelta(), 1 / 30);

    const smoothing = 1 - Math.pow(0.001, dt);
    const sm = uniforms.uMouse.value;
    prev.copy(sm);
    sm.lerp(target, smoothing);

    const instVx = (sm.x - prev.x) / Math.max(dt, 1e-3);
    const instVy = (sm.y - prev.y) / Math.max(dt, 1e-3);
    const vel = uniforms.uMouseVel.value;
    vel.x = vel.x * decayValue + instVx * (1 - decayValue) * 0.06;
    vel.y = vel.y * decayValue + instVy * (1 - decayValue) * 0.06;

    uniforms.uTime.value += dt;

    renderer.render(scene, camera);
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);

  const settableUniforms = { strength: 'uStrength', radius: 'uRadius', chroma: 'uChroma', mono: 'uMono' };

  return {
    renderer,
    canvas: renderer.domElement,

    set(name, value) {
      if (name === 'decay') { decayValue = +value; return; }
      const key = settableUniforms[name];
      if (key) uniforms[key].value = +value;
    },

    setImage,
    redrawOverlay: drawOverlay,

    destroy() {
      running = false;
      cancelAnimationFrame(rafId);
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('resize', resize);
      renderer.domElement.removeEventListener('click', onClick);
      geometry.dispose();
      material.dispose();
      overlayTex.dispose();
      if (uniforms.uTex.value) uniforms.uTex.value.dispose();
      renderer.dispose();
      if (renderer.domElement.parentNode === container) {
        container.removeChild(renderer.domElement);
      }
    },
  };
}

// --- demo bootstrap --------------------------------------------------------

// Images to pick from: this demo's own folder in the shared sample media, with small thumbnails for the tiles in
// thumbs/ (sources and licences in its CREDITS.md). Engravings, gridded windows and bright night lights are what
// the smear shows off best.
const MEDIA = '../sample-media/img/fluid-hover/';
const PHOTOS = ['night-street', 'home-night-5', 'worms-frankfurt', 'helman-federation', 'umbach-strehla', 'wooden-chapel',
  'dore-titans', 'dessau-stair-window', 'dessau-facade', 'farnsworth-snow', 'shinjuku-taxi', 'shibuya-crossing'];
const photoUrl = (photo) => `${MEDIA}${photo}.jpg`;
const thumbUrl = (photo) => `${MEDIA}thumbs/${photo}.jpg`;
const title = (photo) => photo.replace(/-/g, ' ');

// What the panel shows, and what Copy settings writes out.
const DEFAULT_PHOTO = 'home-night-5';
const settings = { image: photoUrl(DEFAULT_PHOTO), strength: 0.48, radius: 6.5, decay: 0.862, chroma: 0.033, mono: true };

const fx = createFluidHover({
  container: document.getElementById('app'),
  image: settings.image,
  strength: settings.strength,
  radius: settings.radius,
  decay: settings.decay,
  chroma: settings.chroma,
  mono: settings.mono,   // the photo in black and white, the smear's fringes in colour
  buttonsAt: 0.85,   // well below the middle, near the foot of the screen
  buttons: [
    { label: 'Explore work', primary: true,  onClick: () => console.log('Explore work') },
    { label: 'Get in touch', primary: false, onClick: () => console.log('Get in touch') },
  ],
});

// --- demo controls
const $ = (id) => document.getElementById(id);
const show = (name) => { $(`u_${name}V`).textContent = +(+settings[name]).toFixed(3); };
for (const name of ['strength', 'radius', 'decay', 'chroma']) {
  $(`u_${name}`).value = settings[name];
  show(name);
  $(`u_${name}`).addEventListener('input', (e) => { settings[name] = +e.target.value; fx.set(name, e.target.value); show(name); });
}
$('u_mono').checked = settings.mono;
$('u_mono').addEventListener('change', (e) => { settings.mono = e.target.checked; fx.set('mono', settings.mono); });

// The image: a tile per photo, the picked one framed and named; a random photo; or an upload.
$('photoGrid').innerHTML = PHOTOS.map((n) =>
  `<button type="button" data-photo="${n}" title="${title(n)}" aria-pressed="false" style="background-image:url('${thumbUrl(n)}')"></button>`).join('');
let objectUrl = null;
function useImage(src, label, photo = null) {
  if (objectUrl && src !== objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; }   // the previous upload, never the new one
  settings.image = src;
  fx.setImage(src);
  $('photoName').textContent = label;
  $('photoGrid').querySelectorAll('[data-photo]').forEach((t) => t.setAttribute('aria-pressed', String(t.dataset.photo === photo)));
}
$('photoGrid').addEventListener('click', (e) => {
  const tile = e.target.closest('[data-photo]');
  if (tile) useImage(photoUrl(tile.dataset.photo), title(tile.dataset.photo), tile.dataset.photo);
});
$('randomPhoto').addEventListener('click', () => {
  useImage(`https://picsum.photos/seed/${Math.random().toString(36).slice(2, 10)}/1600/1000`, 'random photo (picsum.photos)');
});
$('u_file').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  useImage(url, f.name);
  objectUrl = url;   // revoked when the next image replaces it
  e.target.value = '';
});
useImage(settings.image, title(DEFAULT_PHOTO), DEFAULT_PHOTO);

// Copy settings: the effect has no CSS of its own (it is a WebGL shader), so this copies the call that recreates
// it with the current values. An uploaded image only exists in this tab, so it is left as a placeholder.
$('copySettings').addEventListener('click', async () => {
  const btn = $('copySettings');
  const image = settings.image.startsWith('blob:') ? 'your-image.jpg' : settings.image;
  const code = `createFluidHover({\n  container: document.getElementById('app'),\n  image: '${image}',\n` +
    `  strength: ${settings.strength},\n  radius: ${settings.radius},\n  decay: ${settings.decay},\n  chroma: ${settings.chroma},\n  mono: ${settings.mono},\n});\n`;
  try {
    await navigator.clipboard.writeText(code);
    btn.classList.add('is-copied');
    setTimeout(() => btn.classList.remove('is-copied'), 1200);
  } catch {
    console.log(code);
    btn.title = 'Copy blocked - see the console';
  }
});
</script>
<script src="panel-window.js"></script>
</body>
</html>
