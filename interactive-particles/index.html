<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactive Particles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!-- the randomize-studio's panel, copied in (see shared/build.css) -->
<link rel="stylesheet" href="vendor/randomize-studio/css/panel.css">
<link rel="stylesheet" href="vendor/randomize-studio/css/controls.css">
<link rel="stylesheet" href="shared/build.css">
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
</script>
</head>
<body>
  <main class="stage">
    <span class="stage-badge">Loading…</span>
    <div class="drop-hint">Drop an image</div>
  </main>

  <button id="panelShow" data-mark="plus">Maximize edit panel</button>
  <aside class="panel" id="panel">
    <div class="phead">
      <span class="spacer"></span>
      <button id="resetSettings" class="iconbtn" data-mark="undo" title="Reset to defaults and forget the saved settings (the image stays)" aria-label="Reset to defaults"></button>
      <button id="saveSettings" class="iconbtn" data-mark="save" title="Save these settings: this page opens with them from now on" aria-label="Save these settings"></button>
      <button id="copyPrompt" class="iconbtn" data-mark="copy" title="Copy a prompt that recreates this effect (image not included)" aria-label="Copy a prompt that recreates this effect"></button>
      <button id="panelToggle" class="iconbtn" data-mark="minus" title="Minimize"></button>
    </div>
    <div class="pbody">
      <div class="grp">
        <h3>Image</h3>
        <div class="row"><label>grid size</label><input type="range" name="grid-size" min="20" max="400" step="5" value="115"><output>115</output></div>
        <div class="row"><label>brightness</label><input type="range" name="brightness" min="-100" max="100" step="1" value="-15" title="Added to every pixel before the threshold, the size and the colour"><output>-15</output></div>
        <div class="row"><label>contrast</label><input type="range" name="contrast" min="0.2" max="3" step="0.05" value="0.9" title="Every pixel scaled about mid-grey: below 1 flatter, above 1 harder"><output>0.90</output></div>
        <div class="row"><label>background</label><input type="color" name="background" value="#ffffff" title="The colour behind the particles"></div>
        <div class="btnrow spaced">
          <label class="uploadbtn" data-mark="upload">Upload<input type="file" name="image-file" accept="image/*" hidden></label>
          <button type="button" class="reset-button" data-mark="refresh" title="Back to the default portrait: Walter Gropius, 1919">Gropius</button>
        </div>
      </div>
      <div class="grp">
        <h3><label class="toggle" title="Make the particles from the light pixels or from the dark ones"><input type="checkbox" name="invert" role="switch" checked><span class="toggle-label"><span class="when-off">light particles</span><span class="when-on">dark particles</span></span><span class="knob"></span></label></h3>
        <div class="row"><label>threshold</label><input type="range" name="threshold" min="0" max="255" step="1" value="64"><output>64</output></div>
        <div class="row"><label>size</label><input type="range" name="size" min="0.2" max="4" step="0.05" value="1.7"><output>1.70</output></div>
        <div class="row"><label>variation</label><input type="range" name="variation" min="0" max="2" step="0.05" value="0.55"><output>0.55</output></div>
        <div class="row"><label>shape</label><div class="chips">
          <label><input type="radio" name="shape" value="0" checked>circle</label>
          <label><input type="radio" name="shape" value="1">square</label>
          <label><input type="radio" name="shape" value="2">diamond</label>
          <label><input type="radio" name="shape" value="3">ring</label>
          <label><input type="radio" name="shape" value="4">cross</label>
        </div></div>
        <div class="row"><label>edge</label><input type="range" name="edge" min="0" max="0.5" step="0.01" value="0.3"><output>0.30</output></div>
        <div class="row"><label>tone</label><div class="chips">
          <label><input type="radio" name="tone" value="colour" checked>colour</label>
          <label><input type="radio" name="tone" value="grey">grey</label>
        </div></div>
      </div>
      <div class="grp">
        <h3>Motion</h3>
        <div class="row"><label>random</label><input type="range" name="random" min="0" max="20" step="0.1" value="0.8"><output>0.8</output></div>
        <div class="row"><label>depth</label><input type="range" name="depth" min="0" max="40" step="0.1" value="3.4"><output>3.4</output></div>
        <div class="row"><label>speed</label><input type="range" name="speed" min="0" max="3" step="0.05" value="1.45"><output>1.45</output></div>
        <div class="row"><label>idle</label><input type="range" name="idle" min="0" max="1" step="0.05" value="1" title="The speed while the pointer is away, as a share of speed: 0 keeps the particles still until you point at them"><output>1.00</output></div>
      </div>
      <div class="grp">
        <h3>Touch</h3>
        <div class="row"><label>radius</label><input type="range" name="touch-radius" min="0.02" max="0.5" step="0.01" value="0.21"><output>0.21</output></div>
        <div class="row"><label>trail</label><input type="range" name="touch-trail" min="0.2" max="6" step="0.1" value="1.9"><output>1.9</output></div>
        <div class="row"><label>push</label><input type="range" name="touch-push" min="0" max="80" step="1" value="13"><output>13</output></div>
        <div class="row"><label for="c_touchPreview">preview</label><input id="c_touchPreview" type="checkbox" name="touch-preview" title="Show the touch texture the shader reads"></div>
      </div>
    </div>
  </aside>

  <script src="shared/panel-window.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
