<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery Navigation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- One pinned screen, three phases (script.js):
       1. Vertical - two columns of 4, the right moving up, the left (starting at its bottom) moving down. Every
          photo is a cell half the screen tall, so the phase ends on exactly four filling the screen in a 2x2.
       2. Horizontal - the screen switches to two rows holding those same four in the same places, then the top row
          moves right (2 new photos in from the left) and the bottom row left (2 new in from the right), ending
          on a 2x2 again.
       3. Diagonal - the top-left and bottom-right photos fade out, the other two become the first of a line rising
          to the right, which moves down and left (photos in from the top right, a smaller one in each corner).
          It ends with the last corner pair growing into the 2x2 the page opened on, and the scroll loops to the top.
       The photos handed from one layout to the next appear in both; their copies are hidden from assistive tech.
       Photos: Wikimedia Commons Featured Pictures (CC BY / CC BY-SA / CC0), shown without captions. -->
  <main class="nsc-gallery">
    <div class="vertical">
      <div class="column is-reversed">
        <div class="track">
          <figure class="photo">
            <img src="img/chola-valley.jpg" alt="Chola Valley, Himalayas" decoding="async">
          </figure>
          <figure class="photo">
            <img src="img/sossusvlei.jpg" alt="Sossusvlei, Namib Desert" decoding="async">
          </figure>
          <div class="photo title-card">
            <h1 class="title">Scroll<br>based<br>gallery<br>with GSAP</h1>
          </div>
          <figure class="photo">
            <img src="img/bryce-canyon.jpg" alt="Bryce Canyon hoodoos" decoding="async">
          </figure>
        </div>
      </div>
      <div class="column">
        <div class="track">
          <figure class="photo">
            <img src="img/zagedan-lakes.jpg" alt="Zagedan Lakes, Caucasus" decoding="async">
          </figure>
          <figure class="photo">
            <img src="img/sydney-coast.jpg" alt="Sydney coast" decoding="async">
          </figure>
          <figure class="photo">
            <img src="img/crepuscular-rays.jpg" alt="Crepuscular rays, San Francisco" decoding="async">
          </figure>
          <figure class="photo">
            <img src="img/kimono-forest.jpg" alt="Kimono Forest, Kyoto" decoding="async">
          </figure>
        </div>
      </div>
    </div>

    <div class="horizontal">
      <div class="row is-reversed">
        <div class="track">
          <figure class="photo">
            <img src="img/jokulsarlon-ice.jpg" alt="Ice near Jökulsárlón" decoding="async">
          </figure>
          <figure class="photo">
            <img src="img/bisajarvi.jpg" alt="Bisajärvi, Sipoonkorpi" decoding="async">
          </figure>
          <figure class="photo" aria-hidden="true">
            <img src="img/chola-valley.jpg" alt="" decoding="async">
          </figure>
          <figure class="photo" aria-hidden="true">
            <img src="img/crepuscular-rays.jpg" alt="" decoding="async">
          </figure>
        </div>
      </div>
      <div class="row">
        <div class="track">
          <figure class="photo" aria-hidden="true">
            <img src="img/sossusvlei.jpg" alt="" decoding="async">
          </figure>
          <figure class="photo" aria-hidden="true">
            <img src="img/kimono-forest.jpg" alt="" decoding="async">
          </figure>
          <figure class="photo">
            <img src="img/gurudongmar-lake.jpg" alt="Gurudongmar Lake, Sikkim" decoding="async">
          </figure>
          <figure class="photo">
            <img src="img/chamarel-falls.jpg" alt="Chamarel Falls, Mauritius" decoding="async">
          </figure>
        </div>
      </div>
    </div>

    <div class="diagonal">
      <div class="track">
        <figure class="photo" aria-hidden="true">
          <img src="img/gurudongmar-lake.jpg" alt="" decoding="async">
        </figure>
        <figure class="photo" aria-hidden="true">
          <img src="img/bisajarvi.jpg" alt="" decoding="async">
        </figure>
        <figure class="photo">
          <img src="img/night-sky.jpg" alt="Night sky" decoding="async">
        </figure>
        <!-- The line ends on the opening 2x2's bottom-left and top-right. -->
        <figure class="photo" aria-hidden="true">
          <img src="img/bryce-canyon.jpg" alt="" decoding="async">
        </figure>
        <figure class="photo" aria-hidden="true">
          <img src="img/zagedan-lakes.jpg" alt="" decoding="async">
        </figure>

        <!-- Smaller photos in the corners of each step, from the second photo on: one above the line, one below. -->
        <figure class="photo small upper" aria-hidden="true">
          <img src="img/chola-valley.jpg" alt="" decoding="async">
        </figure>
        <figure class="photo small lower">
          <img src="img/rainbow-cones.jpg" alt="Rainbow over volcanic cones" decoding="async">
        </figure>
        <figure class="photo small upper" aria-hidden="true">
          <img src="img/sossusvlei.jpg" alt="" decoding="async">
        </figure>
        <figure class="photo small lower">
          <img src="img/thingvellir.jpg" alt="Þingvellir, Iceland" decoding="async">
        </figure>
        <!-- The last pair grows to full cells: with the line's last two, the opening 2x2, so the scroll can loop. -->
        <div class="photo small upper title-card" aria-hidden="true">
          <p class="title">Scroll<br>based<br>gallery<br>with GSAP</p>
        </div>
        <figure class="photo small lower" aria-hidden="true">
          <img src="img/sydney-coast.jpg" alt="" decoding="async">
        </figure>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
