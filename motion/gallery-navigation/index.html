<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery Navigation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- One pinned screen, three phases (script.js):
       1. Vertical - two columns of 4, the right moving up, the left (starting at its bottom) moving down. Every
          photo is a cell half the screen tall, so the phase ends on exactly four filling the screen in a 2x2.
       2. Horizontal - the screen switches to two rows holding those same four in the same places, then the top row
          moves right (2 new photos in from the left) and the bottom row left (2 new in from the right), ending
          on a 2x2 again.
       3. Diagonal - the top-left and bottom-right photos fade out, the other two become the first of a line rising
          to the right, which moves down and left (photos in from the top right, a smaller one in each corner).
          It ends with the last corner pair growing into the 2x2 the page opened on, and the scroll loops to the top.
       The photos handed from one layout to the next appear in both; their copies are hidden from assistive tech.
       Photos: John Pawson (johnpawson.com), copyright the studio - img/pawson/, 1200px wide. -->
  <main class="nsc-gallery">
    <div class="vertical">
      <div class="column is-reversed">
        <div class="track">
          <figure class="photo">
            <img src="img/pawson/home-night-4.jpg" alt="John Pawson, at night" decoding="async">
          </figure>
          <figure class="photo">
            <img src="img/pawson/home-night-5.jpg" alt="John Pawson, at night" decoding="async">
          </figure>
          <div class="photo title-card">
            <h1 class="title">Scroll<br>based<br>gallery<br>with GSAP</h1>
          </div>
          <figure class="photo">
            <img src="img/pawson/home-night-1.jpg" alt="John Pawson, at night" decoding="async">
          </figure>
        </div>
      </div>
      <div class="column">
        <div class="track">
          <figure class="photo">
            <img src="img/pawson/home-night-2.jpg" alt="John Pawson, at night" decoding="async">
          </figure>
          <figure class="photo">
            <img src="img/pawson/home-night-3.jpg" alt="John Pawson, at night" decoding="async">
          </figure>
          <figure class="photo">
            <img src="img/pawson/home-night-6.jpg" alt="John Pawson, at night" decoding="async">
          </figure>
          <figure class="photo">
            <img src="img/pawson/home-night-7.jpg" alt="John Pawson, at night" decoding="async">
          </figure>
        </div>
      </div>
    </div>

    <div class="horizontal">
      <div class="row is-reversed">
        <div class="track">
          <figure class="photo">
            <img src="img/pawson/philippines-house.jpg" alt="Philippines House, John Pawson" decoding="async">
          </figure>
          <figure class="photo">
            <img src="img/pawson/albion-juene-gallery.jpg" alt="Albion Jeune Gallery, John Pawson" decoding="async">
          </figure>
          <figure class="photo" aria-hidden="true">
            <img src="img/pawson/home-night-4.jpg" alt="" decoding="async">
          </figure>
          <figure class="photo" aria-hidden="true">
            <img src="img/pawson/home-night-6.jpg" alt="" decoding="async">
          </figure>
        </div>
      </div>
      <div class="row">
        <div class="track">
          <figure class="photo" aria-hidden="true">
            <img src="img/pawson/home-night-5.jpg" alt="" decoding="async">
          </figure>
          <figure class="photo" aria-hidden="true">
            <img src="img/pawson/home-night-7.jpg" alt="" decoding="async">
          </figure>
          <figure class="photo">
            <img src="img/pawson/giessen-house.jpg" alt="Giessen House, John Pawson" decoding="async">
          </figure>
          <figure class="photo">
            <img src="img/pawson/wooden-chapel.jpg" alt="Wooden Chapel, John Pawson" decoding="async">
          </figure>
        </div>
      </div>
    </div>

    <div class="diagonal">
      <div class="track">
        <figure class="photo" aria-hidden="true">
          <img src="img/pawson/giessen-house.jpg" alt="" decoding="async">
        </figure>
        <figure class="photo" aria-hidden="true">
          <img src="img/pawson/albion-juene-gallery.jpg" alt="" decoding="async">
        </figure>
        <figure class="photo">
          <img src="img/pawson/the-design-museum.jpg" alt="The Design Museum, John Pawson" decoding="async">
        </figure>
        <!-- The line ends on the opening 2x2's bottom-left and top-right. -->
        <figure class="photo" aria-hidden="true">
          <img src="img/pawson/home-night-1.jpg" alt="" decoding="async">
        </figure>
        <figure class="photo" aria-hidden="true">
          <img src="img/pawson/home-night-2.jpg" alt="" decoding="async">
        </figure>

        <!-- Smaller photos in the corners of each step, from the second photo on: one above the line, one below. -->
        <figure class="photo small upper" aria-hidden="true">
          <img src="img/pawson/home-night-4.jpg" alt="" decoding="async">
        </figure>
        <figure class="photo small lower">
          <img src="img/pawson/st-john-at-hackney.jpg" alt="St John at Hackney, John Pawson" decoding="async">
        </figure>
        <figure class="photo small upper" aria-hidden="true">
          <img src="img/pawson/home-night-5.jpg" alt="" decoding="async">
        </figure>
        <figure class="photo small lower">
          <img src="img/pawson/house-tyrol.jpg" alt="House in Tyrol, John Pawson" decoding="async">
        </figure>
        <!-- The last pair grows to full cells: with the line's last two, the opening 2x2, so the scroll can loop. -->
        <div class="photo small upper title-card" aria-hidden="true">
          <p class="title">Scroll<br>based<br>gallery<br>with GSAP</p>
        </div>
        <figure class="photo small lower" aria-hidden="true">
          <img src="img/pawson/home-night-3.jpg" alt="" decoding="async">
        </figure>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
