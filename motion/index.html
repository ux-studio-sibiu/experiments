<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motion</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --ink: #1b1a17;
      --muted: #8a847a;
      --line: #dcd6cc;
      /* the left nav: light on dark gray */
      --nav-bg: #000000bf;
      --nav-top: 240px; /* how far down the nav (and its expand tab) sits */
      --nav-ink: #f1eee8;
      --nav-muted: #9a958c;
      --nav-hover: rgba(255, 255, 255, 0.14); /* the hover wash on links and the ear */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    /* The selected project fills the whole window in an iframe; the project list floats over its left edge,
       only as tall as its links (at least 300px). */
    .nsc-motion-index {
      position: relative;
      height: 100vh;
      height: 100dvh;

      /* The drawer: the nav plus its ear, against the browser's left edge, var(--nav-top) down. Collapsing slides
         the whole drawer out by the nav's width, so only the ear is left showing at the edge. One drop-shadow on
         the drawer outlines nav and ear as a single shape. */
      .drawer {
        position: absolute;
        top: var(--nav-top);
        left: 0;
        z-index: 2;
        filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.28));
        transition: translate 0.35s cubic-bezier(0.33, 0, 0.2, 1);
      }

      &.is-collapsed .drawer { translate: -100% 0; }
      &.is-restoring .drawer,
      &.is-restoring .ear::before { transition: none; }

      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 18px;
        width: 200px;
        min-height: 300px;
        max-height: calc(100vh - var(--nav-top) - 12px);
        padding: 20px 16px;
        overflow-y: auto;
        background: var(--nav-bg);
        color: var(--nav-ink);
      }

      /* The ear: attached to the nav's right outside edge, 30px down, in the nav's colour, no border. Its caret points
         left to hide the nav and turns to point right once it is hidden. */
      .ear {
        position: absolute;
        top: 30px;
        left: 100%;
        display: grid;
        place-items: center;
        width: 24px;
        height: 34px;
        padding: 0;
        border: 0;
        background: var(--nav-bg);
        color: #fff;
        cursor: pointer;
        transition: background 0.15s ease;

        /* The caret: two borders of a small square turned 45deg, so it sits exactly in the middle (a text glyph
           like the old one rides on the font's baseline). Nudged 2px toward its open side, since a chevron's weight
           sits at its point. */
        &::before {
          content: "";
          display: block;
          width: 9px;
          height: 9px;
          border-left: 2px solid currentColor;
          border-bottom: 2px solid currentColor;
          rotate: 45deg;
          translate: 2px 0;
          transition: rotate 0.35s cubic-bezier(0.33, 0, 0.2, 1), translate 0.35s cubic-bezier(0.33, 0, 0.2, 1);
        }

        /* hover like the project links: the same faint white wash, the caret stays white */
        &:hover { background: linear-gradient(var(--nav-hover), var(--nav-hover)), var(--nav-bg); }
      }

      &.is-collapsed .ear::before { rotate: 225deg; translate: -2px 0; }

      .title {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #fff;
      }

      .projects {
        display: grid;
        gap: 2px;
        list-style: none;

        a {
          display: block;
          padding: 7px 8px;
          margin: 0 -8px;
          font-size: 14px;
          line-height: 1.3;
          color: var(--nav-ink);
          text-decoration: none;
          transition: background 0.15s ease;

          &:hover { background: var(--nav-hover); }
          &.is-current { background: var(--nav-ink); color: var(--nav-bg); }
        }
      }


      /* Two stacked frames for the cross-fade: the new project loads, hidden, in the one at the back, and fades in
         over the old one only once it is ready (see script). */
      .frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #fff;
        z-index: 0;
        opacity: 0;
        transition: opacity 0.45s ease;

        /* the one on screen, fading in on top */
        &.is-shown { z-index: 1; opacity: 1; }
        /* the one it replaces stays solid underneath until the fade is done, so nothing dips toward white */
        &.is-leaving { opacity: 1; transition: none; }
      }
    }
  </style>
</head>
<body>
  <div class="nsc-motion-index">
    <!-- One link per project folder in motion/. Add a line here when a new one is added. -->
    <div class="drawer">
      <nav class="sidebar" aria-label="Projects">
        <p class="title">Scroll Driven:</p>
        <ul class="projects">
          <li><a href="rotate-sectors/">Scroll effect</a></li>
          <li><a href="infinite-zoom/">Infinite zoom scroll</a></li>
          <li><a href="zoom-navigation/">Zoom based navigation</a></li>
          <li><a href="paint-scroll/">Scroll paint</a></li>
        </ul>

        <p class="title">Other:</p>

      </nav>
      <button type="button" class="ear" aria-expanded="true" aria-label="Hide the project list"></button>
    </div>

    <iframe class="frame" title="Project preview"></iframe>
    <iframe class="frame" title="Project preview"></iframe>
  </div>

  <script>
    // Keeps the current project marked, in the address (#infinite-zoom) so a reload or a shared link opens it,
    // and in focus, so its keys and wheel work straight away.
    const links = [...document.querySelectorAll('.projects a')];
    const slug = (a) => a.getAttribute('href').replace(/\/$/, '');

    function select(link) {
      links.forEach((a) => a.classList.toggle('is-current', a === link));
      links.forEach((a) => a.toggleAttribute('aria-current', a === link));
      history.replaceState(null, '', `#${slug(link)}`);
    }

    /* Cross-fade between projects. The new one loads in the hidden frame while the current one stays on screen;
       it fades in only when it is really ready: the frame's load event (the page, its styles, scripts and images),
       then its web fonts (same origin, so the wrapper can wait on document.fonts), then two animation frames so
       its own start-up code has drawn. The old frame stays solid underneath during the fade, then is emptied,
       which stops its loops.
       A click before that finishes simply wins: only the latest request is shown. */
    const frames = [...document.querySelectorAll('.frame')];
    let shown = null;
    let request = 0;

    function show(href) {
      const ticket = ++request;
      const incoming = frames.find((f) => f !== shown);
      incoming.dataset.ticket = ticket;
      incoming.classList.remove('is-shown', 'is-leaving');
      incoming.addEventListener('load', async function ready() {
        incoming.removeEventListener('load', ready);
        try { await incoming.contentDocument?.fonts?.ready; } catch {}
        // two frames so its start-up code has drawn - capped, since a background tab never runs them
        await Promise.race([
          new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r))),
          new Promise((r) => setTimeout(r, 100)),
        ]);
        if (ticket !== request) return; // a later click took over
        const outgoing = shown;
        shown = incoming;
        incoming.classList.add('is-shown');
        incoming.focus();
        if (outgoing) {
          const leaving = outgoing.dataset.ticket;
          outgoing.classList.replace('is-shown', 'is-leaving');
          setTimeout(() => {
            // not if it has since been picked up to load another project
            if (outgoing === shown || outgoing.dataset.ticket !== leaving) return;
            outgoing.classList.remove('is-leaving');
            outgoing.src = 'about:blank';
          }, 500);
        }
      });
      incoming.src = href;
    }

    links.forEach((a) => a.addEventListener('click', (e) => {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return; // new tab / window as usual
      e.preventDefault();
      if (a.classList.contains('is-current')) return;
      select(a);
      show(a.getAttribute('href'));
    }));

    // The ear hides and shows the nav; the choice is remembered for next time.
    const wrapper = document.querySelector('.nsc-motion-index');
    const ear = document.querySelector('.ear');
    const KEY = 'motion-index-collapsed';
    const setCollapsed = (on) => {
      wrapper.classList.toggle('is-collapsed', on);
      ear.setAttribute('aria-expanded', String(!on));
      ear.setAttribute('aria-label', on ? 'Show the project list' : 'Hide the project list');
      try { localStorage.setItem(KEY, on ? '1' : ''); } catch {}
    };
    ear.addEventListener('click', () => setCollapsed(!wrapper.classList.contains('is-collapsed')));
    // Restored without the slide, so a reload doesn't show the nav leaving.
    try {
      if (localStorage.getItem(KEY)) {
        wrapper.classList.add('is-restoring');
        setCollapsed(true);
        requestAnimationFrame(() => requestAnimationFrame(() => wrapper.classList.remove('is-restoring')));
      }
    } catch {}
    // Opens the project in the address (#slug) if there is one, otherwise the default.
    const DEFAULT = 'paint-scroll';
    const start = links.find((a) => `#${slug(a)}` === location.hash) || links.find((a) => slug(a) === DEFAULT) || links[0];
    select(start);
    show(start.getAttribute('href'));
  </script>
</body>
</html>
